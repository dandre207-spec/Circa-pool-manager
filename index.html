let tallyView = 'table';

function renderTallyFull() {
  const el = document.getElementById('sec-tally');
  const tally = calculateTally(S.currentWeek);
  const members = S.settings.members;
  const wk = ensureWeek(S.currentWeek);

  let html = '<div class="flex-between mb-16"><div><div class="card-title" style="font-size:20px">Weighted Tally — Week ' + S.currentWeek + '</div><div class="fs-sm text-dim">Ranked by consensus support</div></div>';
  html += '<div class="btn-group"><button class="btn ' + (tallyView==='table'?'btn-gold':'btn-outline') + ' btn-sm" onclick="tallyView=\'table\';renderTallyFull()">Table</button><button class="btn ' + (tallyView==='card'?'btn-gold':'btn-outline') + ' btn-sm" onclick="tallyView=\'card\';renderTallyFull()">Cards</button><button class="btn ' + (tallyView==='matrix'?'btn-gold':'btn-outline') + ' btn-sm" onclick="tallyView=\'matrix\';renderTallyFull()">Matrix</button></div></div>';

  // Tie-breaking display
  const tbLabels = {score:'Weighted Score',members:'Member Count',pick1:'Pick 1 Count',pick2:'Pick 2 Count',alpha:'Alphabetical'};
  html += '<div class="fs-xs text-dim mb-8">Tie-break order: ' + S.settings.tieBreaking.map(t => tbLabels[t]||t).join(' → ') + '</div>';

  if (tally.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">&#9878;</div><div class="card-title">No picks entered</div><p class="text-dim">Enter picks in the Weekly Picks section to see the tally.</p></div>';
    el.innerHTML = html;
    return;
  }

  // Top 5 highlight
  html += '<div class="card" style="border-color:var(--gold2);background:var(--gold-bg)">';
  html += '<div class="card-title text-gold">&#127942; Top 5 Consensus Picks</div>';
  html += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">';
  tally.slice(0, 5).forEach((t, i) => {
    html += '<div style="background:var(--bg2);border:1px solid var(--gold2);border-radius:var(--radius);padding:10px 16px;text-align:center;min-width:100px">';
    html += '<div class="fs-xs text-dim">#' + (i+1) + '</div>';
    html += '<div class="fw-700" style="font-size:16px">' + esc(teamInfo(t.teamId).abbr) + '</div>';
    html += '<div class="fs-xs">' + esc(teamInfo(t.teamId).name) + '</div>';
    html += '<div class="text-gold fw-700">' + t.score + ' pts</div>';
    html += '<div class="fs-xs text-dim">' + t.memberCount + '/5 members</div>';
    if (i > 0 && hasTie(tally, i)) html += '<div class="tie-indicator">TIE</div>';
    html += '</div>';
  });
  html += '</div></div>';

  if (tallyView === 'table') {
    html += '<div class="card"><div class="table-wrap"><table>';
    html += '<thead><tr><th>#</th><th>Team</th><th>Spread</th><th>Score</th><th>Members</th><th>P1</th><th>P2</th><th>P3</th><th>P4</th><th>P5</th>';
    members.forEach(m => html += '<th>' + esc(m.charAt(0)) + '</th>');
    html += '<th>Entries</th><th>Tie</th></tr></thead><tbody>';

    tally.forEach((t, i) => {
      const isTop5 = i < 5;
      const sp = getSpread(S.currentWeek, t.teamId);
      const tie = hasTie(tally, i);
      html += '<tr' + (isTop5 ? ' class="top5-highlight"' : '') + '>';
      html += '<td class="fw-700 ' + (isTop5 ? 'text-gold' : '') + '">' + (i+1) + '</td>';
      html += '<td class="fw-700">' + esc(teamLabel(t.teamId)) + '</td>';
      html += '<td class="text-gold">' + spreadStr(sp) + '</td>';
      html += '<td class="fw-700">' + t.score + '</td>';
      html += '<td>' + t.memberCount + '/5</td>';
      for (let p = 1; p <= 5; p++) html += '<td>' + t['pick' + p] + '</td>';
      members.forEach(m => {
        const rank = t.supporters[m];
        html += '<td>' + (rank ? '<span class="badge badge-win">' + rank + '</span>' : '') + '</td>';
      });
      html += '<td>' + t.entryExposure + '/5</td>';
      html += '<td>' + (tie ? '<span class="tie-indicator">TIE</span>' : '') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
  } else if (tallyView === 'card') {
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">';
    tally.forEach((t, i) => {
      const isTop5 = i < 5;
      html += '<div class="card" style="' + (isTop5 ? 'border-color:var(--gold2)' : '') + '">';
      html += '<div class="flex-between"><span class="fw-700 ' + (isTop5 ? 'text-gold' : '') + '">#' + (i+1) + '</span>' + (hasTie(tally,i) ? '<span class="tie-indicator">TIE</span>' : '') + '</div>';
      html += '<div class="fw-700" style="font-size:16px;margin:4px 0">' + esc(teamLabel(t.teamId)) + '</div>';
      html += '<div class="text-gold fw-700">' + t.score + ' pts</div>';
      html += '<div class="fs-sm text-dim">' + t.memberCount + ' members | ' + t.entryExposure + ' entries</div>';
      html += '<div class="mt-8">' + Object.entries(t.supporters).map(([m,r]) => memberDot(m) + '<span class="fs-xs">P' + r + '</span>').join(' ') + '</div>';
      html += '</div>';
    });
    html += '</div>';
  } else if (tallyView === 'matrix') {
    html += '<div class="card"><div class="card-title">Member × Team Matrix</div><div class="table-wrap mt-8"><table><thead><tr><th>Team</th>';
    members.forEach(m => html += '<th>' + memberDot(m) + ' ' + esc(m) + '</th>');
    html += '<th>Total</th></tr></thead><tbody>';
    tally.forEach((t, i) => {
      html += '<tr' + (i < 5 ? ' class="top5-highlight"' : '') + '><td class="fw-700">' + esc(teamInfo(t.teamId).abbr) + '</td>';
      members.forEach(m => {
        const rank = t.supporters[m];
        const w = rank ? WEIGHTS[rank - 1] : 0;
        const bg = w > 0 ? 'background:rgba(255,215,0,' + (w / 5 * 0.3) + ')' : '';
        html += '<td class="heatmap-cell" style="' + bg + '">' + (rank ? rank + ' (' + w + ')' : '') + '</td>';
      });
      html += '<td class="fw-700 text-gold">' + t.score + '</td></tr>';
    });
    html += '</tbody></table></div></div>';
  }

  // Export actions
  html += '<div class="btn-group mt-8 no-print">';
  html += '<button class="btn btn-outline btn-sm" onclick="copyTallySummary()">&#128203; Copy Summary</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="exportTallyCSV()">&#128229; Export CSV</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="window.print()">&#128424; Print</button>';
  html += '</div>';

  el.innerHTML = html;
}

function copyTallySummary() {
  const tally = calculateTally(S.currentWeek);
  let text = 'Week ' + S.currentWeek + ' Weighted Tally\n';
  tally.slice(0, 10).forEach((t, i) => {
    text += (i+1) + '. ' + teamLabel(t.teamId) + ' — ' + t.score + ' pts (' + t.memberCount + ' members)\n';
  });
  copyText(text);
}

function exportTallyCSV() {
  const tally = calculateTally(S.currentWeek);
  const members = S.settings.members;
  const rows = [['Rank','Team','Score','Members','Pick1','Pick2','Pick3','Pick4','Pick5',...members,'Entries']];
  tally.forEach((t, i) => {
    rows.push([i+1, teamLabel(t.teamId), t.score, t.memberCount, t.pick1, t.pick2, t.pick3, t.pick4, t.pick5, ...members.map(m => t.supporters[m] || ''), t.entryExposure]);
  });
  exportCSV(rows, 'tally-week-' + S.currentWeek + '.csv');
}

/* ═══════════════════════════════════════════════════════════
   SECTION 18: RENDER — FIVE ENTRIES
   ═══════════════════════════════════════════════════════════ */
function renderEntriesFull() {
  const el = document.getElementById('sec-entries');
  const wk = ensureWeek(S.currentWeek);
  const tally = calculateTally(S.currentWeek);
  const top5 = tally.slice(0, 5).map(t => t.teamId);
  const editable = isWeekEditable(S.currentWeek);

  // Check if consensus changed since manual edits
  let consensusWarning = '';
  const anyManual = wk.entries.some(e => e.manuallyEdited && (e.status === 'approved' || e.status === 'locked'));
  if (anyManual && top5.length > 0) {
    consensusWarning = '<div class="alert alert-warn">&#9888; Consensus has changed since entries were manually edited. Review entries or <button class="btn btn-outline btn-sm" onclick="refreshFromTally()">Refresh From Current Tally</button></div>';
  }

  let html = '<div class="flex-between mb-16"><div><div class="card-title" style="font-size:20px">Five Contest Entries — Week ' + S.currentWeek + '</div><div class="fs-sm text-dim">Each entry needs 5 unique teams</div></div></div>';

  // Mode buttons
  if (editable) {
    html += '<div class="card"><div class="card-title">Entry Mode</div><div class="btn-group mt-8">';
    html += '<button class="btn btn-outline" onclick="setEntryModeManual()">MODE A — Manual</button>';
    html += '<button class="btn btn-outline" onclick="applyConsensusCopy()">MODE B — Consensus Copy</button>';
    html += '<button class="btn btn-gold" onclick="applyDiversified()">MODE C — Diversified Suggestion</button>';
    html += '</div><div class="fs-xs text-dim mt-8">Manual: build each entry by hand. Consensus Copy: all 5 entries = Top 5. Diversified: algorithmic spread across entries.</div></div>';
  }

  html += consensusWarning;

  // Entry cards
  for (let i = 0; i < 5; i++) {
    const entry = wk.entries[i];
    const v = validateEntry(entry);
    const entryPicks = entry.picks || [];
    const isLocked = entry.status === 'locked' || entry.status === 'finalized';
    const consensusCount = entryPicks.filter(t => t && top5.includes(t)).length;
    const totalScore = entryPicks.reduce((sum, tid) => {
      if (!tid) return sum;
      const t = tally.find(x => x.teamId === tid);
      return sum + (t ? t.score : 0);
    }, 0);

    // Check for frozen line differences
    let lineDiffWarning = '';
    if (wk.frozenLines && wk.frozenLines[i]) {
      Object.entries(wk.frozenLines[i]).forEach(([tid, frozenSp]) => {
        const currentSp = getSpread(S.currentWeek, tid);
        if (currentSp != null && frozenSp != null && currentSp !== frozenSp) {
          lineDiffWarning += '<div class="fs-xs text-dim">&#9888; ' + teamInfo(tid).abbr + ': frozen ' + spreadStr(frozenSp) + ' → current ' + spreadStr(currentSp) + '</div>';
        }
      });
    }

    html += '<div class="entry-card ' + (entry.status === 'locked' ? 'locked' : entry.status === 'finalized' ? 'finalized' : '') + '">';
    html += '<div class="flex-between mb-8">';
    html += '<div class="card-title">Entry ' + (i+1) + '</div>';
    html += '<div class="flex-center">';
    html += '<span class="badge badge-' + (entry.status === 'finalized' ? 'finalized' : entry.status === 'locked' ? 'locked' : entry.status === 'approved' ? 'approved' : v.valid ? 'open' : 'draft') + '">' + entry.status.toUpperCase() + '</span>';
    html += '</div></div>';

    // Stats
    html += '<div class="flex-center fs-xs text-dim mb-8">';
    html += '<span>Score: <strong class="text-gold">' + totalScore + '</strong></span>';
    html += '<span>Consensus: <strong>' + consensusCount + '/5</strong></span>';
    html += '<span>' + (v.valid ? '<span class="text-green">Valid</span>' : '<span class="text-red">' + esc(v.msg) + '</span>') + '</span>';
    if (entry.manuallyEdited) html += '<span class="text-dim">(manually edited)</span>';
    html += '</div>';

    if (lineDiffWarning) html += '<div class="alert alert-info fs-xs">' + lineDiffWarning + '</div>';

    // Pick slots
    html += '<table><thead><tr><th>#</th><th>Team</th><th>Spread</th><th>Consensus?</th></tr></thead><tbody>';
    for (let s = 0; s < 5; s++) {
      const tid = entryPicks[s];
      const sp = tid ? getSpread(S.currentWeek, tid) : null;
      const inTop5 = tid && top5.includes(tid);
      const isDup = tid && entryPicks.filter(p => p === tid).length > 1;
      const otherPicks = entryPicks.filter((p, pi) => pi !== s && p != null);

      html += '<tr>';
      html += '<td class="fw-700">' + (s+1) + '</td>';
      if (editable && !isLocked) {
        html += '<td><select onchange="setEntryPick(' + i + ',' + s + ',this.value)" style="min-width:150px">';
        html += '<option value="">— Select —</option>';
        tally.forEach(t => {
          const disabled = otherPicks.includes(t.teamId);
          html += '<option value="' + t.teamId + '"' + (t.teamId === tid ? ' selected' : '') + (disabled ? ' disabled' : '') + '>' + t.teamId + ' ' + teamInfo(t.teamId).name + ' (' + t.score + 'pts)</option>';
        });
        // Include non-tally teams too
        NFL_TEAMS.forEach(t => {
          if (!tally.find(x => x.teamId === t.id)) {
            const disabled = otherPicks.includes(t.id);
            html += '<option value="' + t.id + '"' + (t.id === tid ? ' selected' : '') + (disabled ? ' disabled' : '') + '>' + t.id + ' ' + t.name + '</option>';
          }
        });
        html += '</select>' + (isDup ? ' <span class="tie-indicator">DUP</span>' : '') + '</td>';
      } else {
        html += '<td class="fw-700">' + (tid ? esc(teamLabel(tid)) : '<span class="text-dim">—</span>') + '</td>';
      }
      html += '<td class="text-gold">' + spreadStr(sp) + '</td>';
      html += '<td>' + (inTop5 ? '<span class="badge badge-win">Top 5</span>' : '') + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';

    // Entry actions
    if (editable) {
      html += '<div class="btn-group mt-8">';
      if (!isLocked) {
        html += '<button class="btn btn-green btn-sm" onclick="lockEntry(' + i + ')" ' + (!v.valid ? 'disabled' : '') + '>&#128274; Lock</button>';
        html += '<button class="btn btn-outline btn-sm" onclick="approveEntry(' + i + ')">&#10003; Approve</button>';
        html += '<button class="btn btn-outline btn-sm" onclick="resetEntry(' + i + ')">Reset</button>';
      } else {
        html += '<button class="btn btn-outline btn-sm" onclick="unlockEntry(' + i + ')">Unlock</button>';
      }
      html += '</div>';
    }

    if (entry.notes) html += '<div class="fs-xs text-dim mt-8">Notes: ' + esc(entry.notes) + '</div>';
    html += '</div>';
  }

  // Exposure summary
  if (tally.length > 0) {
    const exposure = {};
    tally.forEach(t => exposure[t.teamId] = 0);
    wk.entries.forEach(e => (e.picks||[]).forEach(tid => { if(tid && exposure[tid] !== undefined) exposure[tid]++; }));
    const exposed = Object.entries(exposure).filter(([,c]) => c > 0).sort((a,b) => b[1] - a[1]);
    if (exposed.length > 0) {
      html += '<div class="card"><div class="card-title">Team Exposure Across 5 Entries</div><div class="mt-8">';
      exposed.forEach(([tid, count]) => {
        const pct = count / 5 * 100;
        const warn = count > (S.settings.diversification.maxExposure || 4);
        html += '<div class="flex-between fs-sm" style="margin-bottom:4px"><span class="fw-700">' + esc(teamInfo(tid).abbr) + '</span><div style="flex:1;margin:0 12px"><div style="background:var(--bg);border-radius:3px;height:8px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:' + (warn ? 'var(--red)' : 'var(--gold)') + ';border-radius:3px"></div></div></div><span>' + count + '/5' + (warn ? ' &#9888;' : '') + '</span></div>';
      });
      html += '</div></div>';
    }
  }

  // Bottom actions
  html += '<div class="btn-group mt-8 no-print">';
  html += '<button class="btn btn-outline btn-sm" onclick="copyEntriesSummary()">&#128203; Copy Submission Text</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="exportEntriesCSV()">&#128229; Export CSV</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="window.print()">&#128424; Print Entries</button>';
  html += '</div>';

  el.innerHTML = html;
}

function setEntryPick(entryIdx, slot, val) {
  const wk = ensureWeek(S.currentWeek);
  wk.entries[entryIdx].picks[slot] = val || null;
  wk.entries[entryIdx].manuallyEdited = true;
  if (wk.entries[entryIdx].status === 'draft') wk.entries[entryIdx].status = 'draft';
  saveState();
  renderEntriesFull();
}

function setEntryModeManual() { toast('Manual mode active — edit each entry directly', 'info'); }

async function applyConsensusCopy() {
  const top5 = getTop5(S.currentWeek);
  if (top5.length < 5) { toast('Need at least 5 teams in the tally', 'warn'); return; }
  const ok = await showConfirm('Consensus Copy', 'All 5 entries will be set to the Top 5 consensus picks. All entries will be identical. Continue?');
  if (!ok) return;
  populateConsensus(S.currentWeek);
  renderEntriesFull();
  toast('All entries set to consensus', 'success');
}

async function applyDiversified() {
  const tally = calculateTally(S.currentWeek);
  if (tally.length < 5) { toast('Need at least 5 teams in the tally', 'warn'); return; }
  const hasManual = ensureWeek(S.currentWeek).entries.some(e => e.manuallyEdited);
  if (hasManual) {
    const ok = await showConfirm('Overwrite Entries', 'Some entries were manually edited. Generate diversified suggestions will overwrite them. Continue?');
    if (!ok) return;
  }
  generateDiversified(S.currentWeek);
  renderEntriesFull();
  toast('Diversified entries generated', 'success');
}

async function refreshFromTally() {
  const ok = await showConfirm('Refresh Entries', 'Reset all entries from current tally? Manual edits will be lost.');
  if (!ok) return;
  generateDiversified(S.currentWeek);
  renderEntriesFull();
}

function lockEntry(idx) {
  const wk = ensureWeek(S.currentWeek);
  wk.entries[idx].status = 'locked';
  logActivity('Entry ' + (idx+1) + ' locked for Week ' + S.currentWeek);
  saveState();
  renderEntriesFull();
}

function approveEntry(idx) {
  const wk = ensureWeek(S.currentWeek);
  wk.entries[idx].status = 'approved';
  saveState();
  renderEntriesFull();
}

function unlockEntry(idx) {
  const wk = ensureWeek(S.currentWeek);
  wk.entries[idx].status = 'draft';
  logActivity('Entry ' + (idx+1) + ' unlocked for Week ' + S.currentWeek);
  saveState();
  renderEntriesFull();
}

function resetEntry(idx) {
  const wk = ensureWeek(S.currentWeek);
  wk.entries[idx] = {picks:[null,null,null,null,null],status:'draft',notes:'',manuallyEdited:false};
  saveState();
  renderEntriesFull();
}

function copyEntriesSummary() {
  const wk = ensureWeek(S.currentWeek);
  let text = 'Circa Pool — Week ' + S.currentWeek + ' Entries\n\n';
  wk.entries.forEach((e, i) => {
    text += 'Entry ' + (i+1) + ': ' + (e.picks||[]).map(tid => tid ? teamInfo(tid).abbr : '?').join(', ') + '\n';
  });
  copyText(text);
}

function exportEntriesCSV() {
  const wk = ensureWeek(S.currentWeek);
  const rows = [['Entry','Pick 1','Pick 2','Pick 3','Pick 4','Pick 5','Status']];
  wk.entries.forEach((e, i) => {
    rows.push(['Entry ' + (i+1), ...(e.picks||[]).map(tid => tid || ''), e.status]);
  });
  exportCSV(rows, 'entries-week-' + S.currentWeek + '.csv');
}

/* ═══════════════════════════════════════════════════════════
   SECTION 19: RENDER — RESULTS
   ═══════════════════════════════════════════════════════════ */
let resultFilter = 'all';
let resultUndoStack = [];

function renderResultsFull() {
  const el = document.getElementById('sec-results');
  const wk = ensureWeek(S.currentWeek);
  const members = S.settings.members;

  // Gather all unique teams selected this week (by members or entries)
  const selectedTeams = new Set();
  members.forEach(m => (wk.picks[m]||[]).forEach(t => { if(t) selectedTeams.add(t); }));
  wk.entries.forEach(e => (e.picks||[]).forEach(t => { if(t) selectedTeams.add(t); }));
  const teamList = [...selectedTeams].sort();

  const editable = isWeekEditable(S.currentWeek);
  const pending = teamList.filter(t => !wk.results[t] || wk.results[t] === 'pending');
  const completed = teamList.filter(t => wk.results[t] && wk.results[t] !== 'pending');

  // Filter
  let displayed = teamList;
  if (resultFilter === 'pending') displayed = pending;
  else if (resultFilter === 'completed') displayed = completed;

  let html = '<div class="flex-between mb-16"><div><div class="card-title" style="font-size:20px">Results — Week ' + S.currentWeek + '</div><div class="fs-sm text-dim">' + completed.length + '/' + teamList.length + ' results entered</div></div>';
  html += '<div class="btn-group">';
  html += '<button class="btn ' + (resultFilter==='all'?'btn-gold':'btn-outline') + ' btn-sm" onclick="resultFilter=\'all\';renderResultsFull()">All</button>';
  html += '<button class="btn ' + (resultFilter==='pending'?'btn-gold':'btn-outline') + ' btn-sm" onclick="resultFilter=\'pending\';renderResultsFull()">Pending (' + pending.length + ')</button>';
  html += '<button class="btn ' + (resultFilter==='completed'?'btn-gold':'btn-outline') + ' btn-sm" onclick="resultFilter=\'completed\';renderResultsFull()">Completed (' + completed.length + ')</button>';
  html += '</div></div>';

  if (teamList.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">&#9989;</div><div class="card-title">No picks to score</div><p class="text-dim">Enter picks first, then return here to enter results.</p></div>';
    el.innerHTML = html;
    return;
  }

  // Bulk entry
  html += '<div class="card"><div class="card-title">Enter Results</div>';
  html += '<div class="table-wrap mt-8"><table><thead><tr><th>Team</th><th>Spread</th><th>Members</th><th>Entries</th><th>Result</th></tr></thead><tbody>';

  displayed.forEach(tid => {
    const sp = getSpread(S.currentWeek, tid);
    const result = wk.results[tid] || 'pending';
    const membersWith = members.filter(m => (wk.picks[m]||[]).includes(tid));
    const entriesWith = wk.entries.filter(e => (e.picks||[]).includes(tid)).length;

    html += '<tr>';
    html += '<td class="fw-700">' + esc(teamLabel(tid)) + '</td>';
    html += '<td class="text-gold">' + spreadStr(sp) + '</td>';
    html += '<td>' + membersWith.map(m => memberDot(m)).join('') + ' <span class="fs-xs text-dim">(' + membersWith.length + ')</span></td>';
    html += '<td class="fs-sm">' + entriesWith + '/5</td>';
    html += '<td>';
    if (editable) {
      html += '<select onchange="setResult(\'' + tid + '\',this.value)" style="width:auto">';
      RESULT_TYPES.forEach(r => {
        html += '<option value="' + r + '"' + (result === r ? ' selected' : '') + '>' + r.charAt(0).toUpperCase() + r.slice(1) + '</option>';
      });
      html += '</select>';
    } else {
      html += '<span class="badge badge-' + result + '">' + result.toUpperCase() + '</span>';
    }
    html += '</td></tr>';
  });

  html += '</tbody></table></div></div>';

  // Undo
  if (resultUndoStack.length > 0 && editable) {
    html += '<button class="btn btn-outline btn-sm mt-8" onclick="undoLastResult()">&#8617; Undo Last Result Change</button>';
  }

  // Week results summary
  let totalW=0,totalL=0,totalP=0;
  displayed.forEach(tid => {
    const r = wk.results[tid];
    if (r === 'win') totalW++;
    else if (r === 'loss') totalL++;
    else if (r === 'push') totalP++;
  });

  if (completed.length > 0) {
    html += '<div class="card"><div class="card-title">Week ' + S.currentWeek + ' Summary</div>';
    // Member results
    html += '<div class="card-sub">Member Results</div><div class="table-wrap"><table><thead><tr><th>Member</th><th>W</th><th>L</th><th>P</th><th>Points</th></tr></thead><tbody>';
    members.forEach(m => {
      const r = getMemberWeeklyResults(S.currentWeek, m);
      html += '<tr><td>' + memberDot(m) + ' ' + esc(m) + '</td><td class="text-green fw-700">' + r.w + '</td><td class="text-red">' + r.l + '</td><td class="text-gold">' + r.p + '</td><td class="fw-700">' + r.pts + '</td></tr>';
    });
    html += '</tbody></table></div>';

    // Entry results
    html += '<div class="card-sub mt-16">Entry Results</div><div class="table-wrap"><table><thead><tr><th>Entry</th><th>W</th><th>L</th><th>P</th><th>Points</th></tr></thead><tbody>';
    for (let i = 0; i < 5; i++) {
      const r = getEntryWeeklyResults(S.currentWeek, i);
      html += '<tr><td class="fw-700">Entry ' + (i+1) + '</td><td class="text-green fw-700">' + r.w + '</td><td class="text-red">' + r.l + '</td><td class="text-gold">' + r.p + '</td><td class="fw-700">' + r.pts + '</td></tr>';
    }
    html += '</tbody></table></div></div>';
  }

  // Actions
  html += '<div class="btn-group mt-8 no-print">';
  if (editable) html += '<button class="btn btn-red btn-sm" onclick="clearResults()">Clear Results</button>';
  html += '</div>';

  el.innerHTML = html;
}

function setResult(teamId, result) {
  const wk = ensureWeek(S.currentWeek);
  const old = wk.results[teamId] || 'pending';
  resultUndoStack.push({ teamId, old });
  wk.results[teamId] = result;
  logActivity(teamInfo(teamId).abbr + ' marked ' + result + ' in Week ' + S.currentWeek);
  saveState();
  renderResultsFull();
}

function undoLastResult() {
  const undo = resultUndoStack.pop();
  if (!undo) return;
  const wk = ensureWeek(S.currentWeek);
  wk.results[undo.teamId] = undo.old;
  saveState();
  toast('Undone: ' + teamInfo(undo.teamId).abbr + ' back to ' + undo.old, 'info');
  renderResultsFull();
}

async function clearResults() {
  const ok = await showConfirm('Clear Results', 'Reset all results for Week ' + S.currentWeek + ' to Pending?');
  if (!ok) return;
  const wk = ensureWeek(S.currentWeek);
  Object.keys(wk.results).forEach(k => wk.results[k] = 'pending');
  logActivity('Cleared results for Week ' + S.currentWeek);
  saveState();
  renderResultsFull();
}

/* ═══════════════════════════════════════════════════════════
   SECTION 20: RENDER — SEASON SUMMARY
   ═══════════════════════════════════════════════════════════ */
function renderSeasonFull() {
  const el = document.getElementById('sec-season');
  const members = S.settings.members;

  let html = '<div class="card-title" style="font-size:20px;margin-bottom:16px">Season Summary — ' + S.settings.season + '</div>';

  // Member performance
  html += '<div class="card"><div class="card-title">Member Performance</div><div class="table-wrap mt-8"><table>';
  html += '<thead><tr><th>Member</th><th>W</th><th>L</th><th>P</th><th>Season Pts</th><th>Weeks</th><th>Picks</th><th>Avg/Wk</th></tr></thead><tbody>';
  members.forEach(m => {
    const s = getMemberSeasonStats(m);
    html += '<tr><td>' + memberDot(m) + ' <strong>' + esc(m) + '</strong></td>';
    html += '<td class="text-green fw-700">' + s.w + '</td><td class="text-red">' + s.l + '</td><td class="text-gold">' + s.p + '</td>';
    html += '<td class="fw-700 text-gold">' + s.pts + '</td><td>' + s.weeksPlayed + '</td><td>' + s.totalPicks + '</td><td>' + s.avg + '</td></tr>';
  });
  html += '</tbody></table></div></div>';

  // Entry performance
  html += '<div class="card"><div class="card-title">Entry Performance</div><div class="table-wrap mt-8"><table>';
  html += '<thead><tr><th>Entry</th><th>W</th><th>L</th><th>P</th><th>Season Pts</th><th>Weeks</th><th>Avg/Wk</th><th>Best Wk</th><th>Worst Wk</th></tr></thead><tbody>';
  const entryStats = [];
  for (let i = 0; i < 5; i++) {
    const s = getEntrySeasonStats(i);
    entryStats.push({idx:i,...s});
    html += '<tr><td class="fw-700">Entry ' + (i+1) + '</td>';
    html += '<td class="text-green fw-700">' + s.w + '</td><td class="text-red">' + s.l + '</td><td class="text-gold">' + s.p + '</td>';
    html += '<td class="fw-700 text-gold">' + s.pts + '</td><td>' + s.weeksPlayed + '</td><td>' + s.avg + '</td>';
    html += '<td>' + (s.bestWk ? 'Wk ' + s.bestWk + ' (' + s.best + ')' : '—') + '</td>';
    html += '<td>' + (s.worstWk ? 'Wk ' + s.worstWk + ' (' + s.worst + ')' : '—') + '</td></tr>';
  }
  html += '</tbody></table></div>';

  // Entry ranking
  const ranked = [...entryStats].sort((a,b) => b.pts - a.pts);
  html += '<div class="card-sub mt-8">Current Ranking:</div><div>';
  ranked.forEach((e, i) => {
    html += '<div class="flex-between fs-sm" style="padding:4px 0"><span class="fw-700">#' + (i+1) + ' Entry ' + (e.idx+1) + '</span><span class="text-gold fw-700">' + e.pts + ' pts</span></div>';
  });
  html += '</div></div>';

  // Week-by-week breakdown
  html += '<div class="card"><div class="card-title">Week-by-Week</div><div class="table-wrap mt-8"><table><thead><tr><th>Week</th>';
  members.forEach(m => html += '<th>' + esc(m.charAt(0)) + '</th>');
  for (let i = 0; i < 5; i++) html += '<th>E' + (i+1) + '</th>';
  html += '<th>Status</th></tr></thead><tbody>';

  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const weekData = S.weeks[w];
    if (!weekData) {
      html += '<tr><td class="fw-700">Wk ' + w + '</td><td colspan="' + (members.length + 6) + '" class="text-dim fs-sm">No data</td></tr>';
      continue;
    }
    html += '<tr><td class="fw-700">Wk ' + w + '</td>';
    members.forEach(m => {
      const r = getMemberWeeklyResults(w, m);
      html += '<td class="fs-sm">' + (r.total > 0 ? r.w + '-' + r.l + '-' + r.p : '<span class="text-dim">—</span>') + '</td>';
    });
    for (let i = 0; i < 5; i++) {
      const r = getEntryWeeklyResults(w, i);
      html += '<td class="fs-sm">' + (r.total > 0 ? '<span class="text-gold fw-700">' + r.pts + '</span>' : '<span class="text-dim">—</span>') + '</td>';
    }
    html += '<td><span class="badge badge-' + (weekData.finalized ? 'finalized' : 'open') + '">' + (weekData.finalized ? 'Final' : 'Open') + '</span></td>';
    html += '</tr>';
  }
  html += '</tbody></table></div></div>';

  // Simple visual chart (CSS bar chart)
  html += '<div class="card"><div class="card-title">Entry Points by Week</div><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px">';
  for (let i = 0; i < 5; i++) {
    html += '<div style="flex:1;min-width:150px"><div class="fs-sm fw-700 mb-8">Entry ' + (i+1) + '</div><div class="bar-chart">';
    for (let w = 1; w <= TOTAL_WEEKS; w++) {
      const r = getEntryWeeklyResults(w, i);
      const h = r.pts * 16;
      html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center"><div class="bar" style="height:' + h + 'px;width:100%;max-width:24px;background:' + (r.pts >= 4 ? 'var(--green)' : r.pts >= 2 ? 'var(--gold)' : r.total > 0 ? 'var(--red)' : 'var(--border)') + '"></div><div class="bar-label">' + w + '</div></div>';
    }
    html += '</div></div>';
  }
  html += '</div></div>';

  // Export
  html += '<div class="btn-group mt-8 no-print"><button class="btn btn-outline btn-sm" onclick="exportSeasonCSV()">&#128229; Export CSV</button><button class="btn btn-outline btn-sm" onclick="exportSeasonJSON()">&#128229; Export JSON</button><button class="btn btn-outline btn-sm" onclick="window.print()">&#128424; Print</button></div>';

  el.innerHTML = html;
}

function exportSeasonCSV() {
  const members = S.settings.members;
  const rows = [['Week', ...members.map(m => m + ' Pts'), 'E1 Pts','E2 Pts','E3 Pts','E4 Pts','E5 Pts']];
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const row = ['Week ' + w];
    members.forEach(m => row.push(getMemberWeeklyResults(w, m).pts));
    for (let i = 0; i < 5; i++) row.push(getEntryWeeklyResults(w, i).pts);
    rows.push(row);
  }
  exportCSV(rows, 'season-summary-' + S.settings.season + '.csv');
}

function exportSeasonJSON() {
  const data = { season: S.settings.season, members: {}, entries: {} };
  S.settings.members.forEach(m => data.members[m] = getMemberSeasonStats(m));
  for (let i = 0; i < 5; i++) data.entries['Entry ' + (i+1)] = getEntrySeasonStats(i);
  downloadFile(JSON.stringify(data, null, 2), 'season-summary-' + S.settings.season + '.json');
}

/* ═══════════════════════════════════════════════════════════
   SECTION 21: RENDER — TEAM FREQUENCY
   ═══════════════════════════════════════════════════════════ */
let freqFilter = { member: null, minFreq: 0 };

function renderFrequencyFull() {
  const el = document.getElementById('sec-frequency');
  const members = S.settings.members;
  const freq = calculateFrequency(freqFilter);
  const filtered = freq.filter(f => f.total >= freqFilter.minFreq);
  const sorted = filtered.sort((a,b) => b.total - a.total);

  let html = '<div class="flex-between mb-16"><div><div class="card-title" style="font-size:20px">Team Frequency Report</div><div class="fs-sm text-dim">How often each team is selected</div></div></div>';

  // Filters
  html += '<div class="card"><div class="form-row"><div class="form-group"><label>Member Filter</label><select onchange="freqFilter.member=this.value||null;renderFrequencyFull()"><option value="">All Members</option>';
  members.forEach(m => html += '<option value="' + esc(m) + '"' + (freqFilter.member === m ? ' selected' : '') + '>' + esc(m) + '</option>');
  html += '</select></div><div class="form-group"><label>Min Frequency</label><input type="number" value="' + freqFilter.minFreq + '" min="0" onchange="freqFilter.minFreq=parseInt(this.value)||0;renderFrequencyFull()"></div></div></div>';

  // Top teams summary
  const topUsed = sorted.slice(0, 5);
  const leastUsed = sorted.filter(f => f.total > 0).slice(-5).reverse();
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">';
  html += '<div class="card"><div class="card-title fs-sm">Most Selected</div>';
  topUsed.forEach(f => html += '<div class="flex-between fs-sm" style="padding:3px 0"><span class="fw-700">' + esc(teamInfo(f.teamId).abbr) + '</span><span>' + f.total + 'x</span></div>');
  html += '</div>';
  html += '<div class="card"><div class="card-title fs-sm">Least Selected</div>';
  leastUsed.forEach(f => html += '<div class="flex-between fs-sm" style="padding:3px 0"><span class="fw-700">' + esc(teamInfo(f.teamId).abbr) + '</span><span>' + f.total + 'x</span></div>');
  html += '</div></div>';

  // Main table
  html += '<div class="card"><div class="table-wrap"><table><thead><tr><th>Team</th><th>Total</th>';
  members.forEach(m => html += '<th>' + esc(m.charAt(0)) + '</th>');
  html += '<th>Wt Pts</th><th>Avg Rank</th>';
  for (let i = 0; i < 5; i++) html += '<th>E' + (i+1) + '</th>';
  html += '<th>Entry Tot</th><th>W</th><th>L</th><th>P</th><th>Res Pts</th></tr></thead><tbody>';

  sorted.forEach(f => {
    if (f.total === 0 && freqFilter.minFreq <= 0) {
      html += '<tr><td class="fw-700 text-dim">' + esc(teamInfo(f.teamId).abbr) + '</td><td class="text-dim">0</td>';
      html += '<td colspan="' + (members.length + 10) + '" class="text-dim">—</td></tr>';
      return;
    }
    if (f.total === 0) return;
    html += '<tr><td class="fw-700">' + esc(teamLabel(f.teamId)) + '</td>';
    html += '<td class="fw-700">' + f.total + '</td>';
    members.forEach(m => {
      const cnt = f.byMember[m] || 0;
      const bg = cnt > 0 ? 'background:rgba(255,215,0,' + Math.min(cnt / 5, 1) * 0.3 + ')' : '';
      html += '<td class="heatmap-cell" style="' + bg + '">' + (cnt || '') + '</td>';
    });
    html += '<td class="text-gold">' + f.weightedPts + '</td>';
    html += '<td>' + f.avgRank + '</td>';
    for (let i = 0; i < 5; i++) html += '<td>' + (f.entryUse[i] || '') + '</td>';
    html += '<td>' + f.entryTotal + '</td>';
    html += '<td class="text-green">' + f.w + '</td><td class="text-red">' + f.l + '</td><td class="text-gold">' + f.p + '</td><td class="fw-700">' + f.resultPts + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table></div></div>';

  html += '<div class="btn-group mt-8 no-print"><button class="btn btn-outline btn-sm" onclick="exportFreqCSV()">&#128229; Export CSV</button><button class="btn btn-outline btn-sm" onclick="window.print()">&#128424; Print</button></div>';

  el.innerHTML = html;
}

function exportFreqCSV() {
  const members = S.settings.members;
  const freq = calculateFrequency(freqFilter).filter(f => f.total > 0).sort((a,b) => b.total - a.total);
  const rows = [['Team','Total',...members,'Wt Pts','Avg Rank','E1','E2','E3','E4','E5','Entry Total','W','L','P','Res Pts']];
  freq.forEach(f => {
    rows.push([teamLabel(f.teamId), f.total, ...members.map(m => f.byMember[m]||0), f.weightedPts, f.avgRank, ...f.entryUse, f.entryTotal, f.w, f.l, f.p, f.resultPts]);
  });
  exportCSV(rows, 'team-frequency-' + S.settings.season + '.csv');
}

/* ═══════════════════════════════════════════════════════════
   SECTION 22: RENDER — LINES & SPREADS
   ═══════════════════════════════════════════════════════════ */
function renderLinesFull() {
  const el = document.getElementById('sec-lines');
  const wk = ensureWeek(S.currentWeek);
  const lines = wk.lines || {};
  const contestLines = wk.contestLines || {};
  const lineCount = Object.keys(lines).length;
  const contestCount = Object.keys(contestLines).length;
  const editable = isWeekEditable(S.currentWeek);

  // Group games by matchup
  const games = {};
  Object.entries(lines).forEach(([tid, line]) => {
    if (line.homeAway === 'home') {
      games[tid] = { home: tid, away: line.opponent, marketSpread: line.spread, gameDate: line.gameDate, source: line.source, lastUpdate: line.lastUpdate };
    }
  });
  const gameList = Object.values(games).sort((a,b) => (a.gameDate||'').localeCompare(b.gameDate||''));

  let html = '<div style="margin-bottom:16px"><div class="card-title" style="font-size:20px">Lines & Spreads — Week ' + S.currentWeek + '</div><div class="fs-sm text-dim">' + gameList.length + ' games | ' + contestCount + ' contest lines locked</div>';
  html += '<div style="margin-top:10px"><button class="btn btn-gold" onclick="fetchESPNLinesUI()">&#9889; Fetch Live Lines</button></div></div>';

  // ═══ UNIFIED GAME BOARD ═══
  html += '<div class="card"><div class="card-title">&#127944; Week ' + S.currentWeek + ' Game Board</div>';
  html += '<div class="card-sub">Market lines, contest lines, and movement at a glance</div>';

  if (gameList.length === 0 && contestCount === 0) {
    html += '<div class="empty-state mt-8"><div class="empty-icon">&#128178;</div><div class="fw-700" style="margin-bottom:6px">No lines loaded yet</div><p class="text-dim">Tap "Fetch Live Lines" above to pull current spreads.</p></div>';
  } else {

    // ── DESKTOP TABLE ──
    html += '<div class="table-wrap mt-8 desktop-table"><table><thead><tr>';
    html += '<th>Away</th><th></th><th>Home</th><th>Date / Time</th>';
    html += '<th style="text-align:center">Market Line</th>';
    html += '<th style="text-align:center;color:var(--gold)">Contest Line</th>';
    html += '<th style="text-align:center">Move</th>';
    html += '<th>Source</th>';
    html += '</tr></thead><tbody>';

    gameList.forEach(g => {
      const awayInfo = teamInfo(g.away);
      const homeInfo = teamInfo(g.home);
      const cs = getContestSpread(S.currentWeek, g.home);
      const ms = g.marketSpread;
      const diff = (cs != null && ms != null) ? (ms - cs) : null;
      const diffAbs = diff != null ? Math.abs(diff) : 0;
      const diffStr = diff != null ? (diff === 0 ? '—' : (diff > 0 ? '+' + diff.toFixed(1) : diff.toFixed(1))) : '';
      const diffColor = diffAbs >= 2 ? 'var(--red)' : diffAbs > 0 ? 'var(--orange)' : 'var(--green)';

      html += '<tr>';
      html += '<td class="fw-700" style="font-size:15px">' + esc(awayInfo.abbr) + ' <span class="fs-xs text-dim">' + esc(awayInfo.name) + '</span></td>';
      html += '<td class="text-dim fs-sm">@</td>';
      html += '<td class="fw-700" style="font-size:15px">' + esc(homeInfo.abbr) + ' <span class="fs-xs text-dim">' + esc(homeInfo.name) + '</span></td>';
      html += '<td class="fs-sm">' + esc(g.gameDate || '—') + '</td>';
      html += '<td style="text-align:center"><span class="fw-700" style="font-size:15px">' + (ms != null ? esc(homeInfo.abbr) + ' ' + spreadStr(ms) : '<span class="text-dim">—</span>') + '</span></td>';
      html += '<td style="text-align:center">';
      if (cs != null) html += '<span class="fw-700 text-gold" style="font-size:15px">' + esc(homeInfo.abbr) + ' ' + spreadStr(cs) + '</span> <span class="badge badge-finalized">LOCKED</span>';
      else html += '<span class="text-dim fs-sm">Not set</span>';
      html += '</td>';
      html += '<td style="text-align:center">';
      if (diff != null && diff !== 0) html += '<span style="color:' + diffColor + ';font-weight:700;font-size:13px">' + diffStr + '</span>';
      else if (diff === 0) html += '<span class="text-green fs-sm">= No move</span>';
      html += '</td>';
      html += '<td class="fs-xs text-dim">' + esc(g.source || '') + '</td>';
      html += '</tr>';
    });

    const marketHomeTeams = new Set(gameList.map(g => g.home));
    const marketAwayTeams = new Set(gameList.map(g => g.away));
    Object.entries(contestLines).forEach(([tid, cl]) => {
      if (!marketHomeTeams.has(tid) && !marketAwayTeams.has(tid)) {
        html += '<tr><td colspan="3" class="fw-700">' + esc(teamLabel(tid)) + '</td><td class="text-dim fs-sm">—</td>';
        html += '<td style="text-align:center" class="text-dim">—</td>';
        html += '<td style="text-align:center"><span class="fw-700 text-gold">' + spreadStr(cl.spread) + '</span> <span class="badge badge-finalized">LOCKED</span></td>';
        html += '<td></td><td class="fs-xs text-dim">Circa Contest</td></tr>';
      }
    });
    html += '</tbody></table></div>';

    // ── MOBILE GAME CARDS ──
    html += '<div class="game-cards">';
    gameList.forEach(g => {
      const awayInfo = teamInfo(g.away);
      const homeInfo = teamInfo(g.home);
      const cs = getContestSpread(S.currentWeek, g.home);
      const ms = g.marketSpread;
      const diff = (cs != null && ms != null) ? (ms - cs) : null;
      const diffAbs = diff != null ? Math.abs(diff) : 0;
      const diffColor = diffAbs >= 2 ? 'var(--red)' : diffAbs > 0 ? 'var(--orange)' : 'var(--green)';

      html += '<div class="game-card">';
      html += '<div class="game-card-matchup">';
      html += '<span class="game-card-team">' + esc(awayInfo.abbr) + '</span>';
      html += '<span class="game-card-at">@</span>';
      html += '<span class="game-card-team">' + esc(homeInfo.abbr) + '</span>';
      html += '</div>';
      html += '<div class="game-card-lines">';
      html += '<div class="game-card-line"><div class="game-card-line-label">Market</div><div class="game-card-line-val">' + (ms != null ? esc(homeInfo.abbr) + ' ' + spreadStr(ms) : '—') + '</div></div>';
      html += '<div class="game-card-line" style="' + (cs != null ? 'border-color:var(--gold2);background:var(--gold-bg)' : '') + '"><div class="game-card-line-label" style="color:var(--gold)">Contest</div><div class="game-card-line-val">';
      if (cs != null) html += '<span class="text-gold">' + esc(homeInfo.abbr) + ' ' + spreadStr(cs) + '</span>';
      else html += '<span class="text-dim">—</span>';
      html += '</div></div>';
      html += '</div>';
      html += '<div class="game-card-meta"><span>' + esc(g.gameDate || '') + '</span>';
      if (diff != null && diff !== 0) html += '<span style="color:' + diffColor + ';font-weight:700">Move: ' + (diff > 0 ? '+' : '') + diff.toFixed(1) + '</span>';
      else if (diff === 0) html += '<span class="text-green">No movement</span>';
      html += '</div></div>';
    });
    // Contest-only lines as cards
    Object.entries(contestLines).forEach(([tid, cl]) => {
      if (!marketHomeTeams.has(tid) && !marketAwayTeams.has(tid)) {
        html += '<div class="game-card"><div class="game-card-matchup"><span class="game-card-team">' + esc(teamLabel(tid)) + '</span></div>';
        html += '<div class="game-card-lines"><div class="game-card-line"><div class="game-card-line-label">Market</div><div class="game-card-line-val text-dim">—</div></div>';
        html += '<div class="game-card-line" style="border-color:var(--gold2);background:var(--gold-bg)"><div class="game-card-line-label" style="color:var(--gold)">Contest</div><div class="game-card-line-val text-gold">' + spreadStr(cl.spread) + '</div></div></div></div>';
      }
    });
    html += '</div>';
  }

  const anyLine = Object.values(lines)[0];
  if (anyLine && anyLine.lastUpdate) {
    html += '<div class="fs-xs text-dim mt-8">Last fetched: ' + formatDt(anyLine.lastUpdate) + '</div>';
  }
  html += '</div>';

  // ═══ ACTIONS BAR ═══
  html += '<div class="card"><div class="flex-between"><div class="card-title">Actions</div></div>';
  html += '<div class="btn-group mt-8">';
  if (lineCount > 0 && editable) html += '<button class="btn btn-gold btn-sm" onclick="copyMarketToContest()">&#128274; Copy Market → Contest Lines</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="showLinesCSVImport()">Paste CSV</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="showLinesJSONImport()">Paste JSON</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="exportLinesCSV()">Export CSV</button>';
  if (lineCount > 0) html += '<button class="btn btn-red btn-sm" onclick="clearLines()">Clear Market Lines</button>';
  html += '</div>';
  if (lineCount > 0 && editable) html += '<div class="fs-xs text-dim mt-8">"Copy Market → Contest" locks the current market spreads as your Circa contest lines. Once locked, they will not change even if you refresh market lines.</div>';
  html += '</div>';

  // ═══ MANUAL CONTEST LINE ENTRY ═══
  if (editable) {
    html += '<div class="card" style="border-color:var(--gold2)"><div class="card-title text-gold">Add/Edit Contest Line</div>';
    html += '<div class="card-sub">Manually enter or override individual Circa contest spreads</div>';
    html += '<div class="form-row mt-8">';
    html += '<div class="form-group"><label>Team</label><select id="contestLineTeam"><option value="">Select Team...</option>';
    NFL_TEAMS.forEach(t => html += '<option value="' + t.id + '">' + t.abbr + ' ' + t.name + '</option>');
    html += '</select></div>';
    html += '<div class="form-group"><label>Contest Spread</label><input type="number" step="0.5" id="contestLineSpread" placeholder="-3.5"></div>';
    html += '</div>';
    html += '<button class="btn btn-gold btn-sm" onclick="addContestLine()">&#128274; Lock Contest Line</button>';
    html += '</div>';
  }

  // Manual add
  if (editable) {
    html += '<div class="card"><div class="card-title">Add/Edit Line Manually</div>';
    html += '<div class="form-row mt-8">';
    html += '<div class="form-group"><label>Team</label><select id="lineTeam">';
    html += '<option value="">Select...</option>';
    NFL_TEAMS.forEach(t => html += '<option value="' + t.id + '">' + t.abbr + ' ' + t.name + '</option>');
    html += '</select></div>';
    html += '<div class="form-group"><label>Opponent</label><select id="lineOpp"><option value="">Select...</option>';
    NFL_TEAMS.forEach(t => html += '<option value="' + t.id + '">' + t.abbr + ' ' + t.name + '</option>');
    html += '</select></div>';
    html += '<div class="form-group"><label>Spread</label><input type="number" step="0.5" id="lineSpread" placeholder="-3.5"></div>';
    html += '<div class="form-group"><label>Home/Away</label><select id="lineHA"><option value="home">Home</option><option value="away">Away</option><option value="neutral">Neutral</option></select></div>';
    html += '</div>';
    html += '<div class="form-row"><div class="form-group"><label>Game Date/Time</label><input type="text" id="lineDate" placeholder="Sun Sep 7, 1:00 PM"></div>';
    html += '<div class="form-group"><label>Notes</label><input type="text" id="lineNotes" placeholder="Optional notes"></div></div>';
    html += '<button class="btn btn-gold btn-sm" onclick="addManualLine()">Add Line</button>';
    html += '</div>';
  }

  el.innerHTML = html;
}

function addManualLine() {
  const tid = document.getElementById('lineTeam').value;
  if (!tid) { toast('Select a team', 'warn'); return; }
  const wk = ensureWeek(S.currentWeek);
  wk.lines[tid] = {
    spread: parseFloat(document.getElementById('lineSpread').value) || null,
    opponent: document.getElementById('lineOpp').value || '',
    homeAway: document.getElementById('lineHA').value || '',
    gameDate: document.getElementById('lineDate').value || '',
    source: 'Manual',
    sourceTimestamp: new Date().toISOString(),
    manual: true,
    lastUpdate: new Date().toISOString(),
    notes: document.getElementById('lineNotes').value || ''
  };
  saveState();
  toast(teamInfo(tid).abbr + ' line added', 'success');
  logActivity('Manual line added: ' + teamInfo(tid).abbr + ' ' + spreadStr(wk.lines[tid].spread));
  renderLinesFull();
}

function editLine(tid) {
  const wk = ensureWeek(S.currentWeek);
  const line = wk.lines[tid];
  if (!line) return;
  document.getElementById('lineTeam').value = tid;
  document.getElementById('lineOpp').value = line.opponent || '';
  document.getElementById('lineSpread').value = line.spread ?? '';
  document.getElementById('lineHA').value = line.homeAway || 'home';
  document.getElementById('lineDate').value = line.gameDate || '';
  document.getElementById('lineNotes').value = line.notes || '';
  window.scrollTo(0, document.body.scrollHeight);
}

function removeLine(tid) {
  const wk = ensureWeek(S.currentWeek);
  delete wk.lines[tid];
  saveState();
  renderLinesFull();
}

function fetchLinesUI() {
  fetchLinesForWeek(S.currentWeek).then(() => renderLinesFull());
}

async function fetchESPNLinesUI() {
  // ESPN is primary — no API key needed, reliable
  const espnCount = await fetchESPNLinesForWeek(S.currentWeek);
  if (espnCount > 0) { renderLinesFull(); return; }

  // Fall back to Odds API if ESPN returned nothing and key is configured
  if (S.settings.oddsApiKey) {
    toast('ESPN returned no data, trying Odds API...', 'warn');
    const oddsCount = await fetchOddsAPILines(S.currentWeek);
    if (oddsCount > 0) { renderLinesFull(); return; }
  }

  toast('Could not fetch lines. ESPN may not have data for Week ' + S.currentWeek + ' yet.', 'error');
  renderLinesFull();
}

function addContestLine() {
  const tid = document.getElementById('contestLineTeam').value;
  const spread = document.getElementById('contestLineSpread').value;
  if (!tid) { toast('Select a team', 'warn'); return; }
  if (spread === '') { toast('Enter a spread', 'warn'); return; }
  setContestLine(S.currentWeek, tid, spread);
  toast(teamInfo(tid).abbr + ' contest line locked at ' + spreadStr(parseFloat(spread)), 'success');
  logActivity('Contest line set: ' + teamInfo(tid).abbr + ' ' + spreadStr(parseFloat(spread)) + ' Week ' + S.currentWeek);
  renderLinesFull();
}

function removeContestLine(tid) {
  const wk = ensureWeek(S.currentWeek);
  if (wk.contestLines) delete wk.contestLines[tid];
  saveState();
  renderLinesFull();
}

async function copyMarketToContest() {
  const wk = ensureWeek(S.currentWeek);
  const existing = Object.keys(wk.contestLines || {}).length;
  if (existing > 0) {
    const ok = await showConfirm('Overwrite Contest Lines', 'This will replace ' + existing + ' existing contest lines with current market lines. Contest lines are meant to be locked. Continue?');
    if (!ok) return;
  }
  if (!wk.contestLines) wk.contestLines = {};
  let count = 0;
  Object.entries(wk.lines || {}).forEach(([tid, line]) => {
    if (line.spread != null) {
      wk.contestLines[tid] = {
        spread: line.spread,
        lockedAt: new Date().toISOString(),
        source: 'Copied from market'
      };
      count++;
    }
  });
  saveState();
  toast(count + ' market lines copied to contest lines', 'success');
  logActivity('Copied ' + count + ' market lines to contest lines for Week ' + S.currentWeek);
  renderLinesFull();
}

function showLinesCSVImport() {
  openGenericModal('<div class="modal-title">Import Lines from CSV</div><div class="fs-sm text-dim mb-8">Format: Team,Spread,Opponent,Home/Away,GameDate (one per line, header optional)</div><textarea id="csvLinesInput" rows="8" placeholder="KC,-3,BAL,home,Sun Sep 7"></textarea><div class="modal-actions"><button class="btn btn-outline" onclick="closeGenericModal()">Cancel</button><button class="btn btn-gold" onclick="importLinesFromCSV(' + S.currentWeek + ',document.getElementById(\'csvLinesInput\').value);closeGenericModal();renderLinesFull()">Import</button></div>');
}

function showLinesJSONImport() {
  openGenericModal('<div class="modal-title">Import Lines from JSON</div><div class="fs-sm text-dim mb-8">Array of objects with team, spread, opponent, homeAway, gameDate fields</div><textarea id="jsonLinesInput" rows="8" placeholder=\'[{"team":"KC","spread":-3,"opponent":"BAL"}]\'></textarea><div class="modal-actions"><button class="btn btn-outline" onclick="closeGenericModal()">Cancel</button><button class="btn btn-gold" onclick="importLinesFromJSON(' + S.currentWeek + ',document.getElementById(\'jsonLinesInput\').value);closeGenericModal();renderLinesFull()">Import</button></div>');
}

function exportLinesCSV() {
  const wk = ensureWeek(S.currentWeek);
  const rows = [['Team','Spread','Opponent','Home/Away','Game Date','Source','Notes']];
  Object.entries(wk.lines).forEach(([tid, l]) => {
    rows.push([tid, l.spread, l.opponent, l.homeAway, l.gameDate, l.source, l.notes]);
  });
  exportCSV(rows, 'lines-week-' + S.currentWeek + '.csv');
}

async function clearLines() {
  const ok = await showConfirm('Clear Lines', 'Remove all lines for Week ' + S.currentWeek + '?');
  if (!ok) return;
  ensureWeek(S.currentWeek).lines = {};
  saveState();
  logActivity('Cleared lines for Week ' + S.currentWeek);
  renderLinesFull();
}

/* ═══════════════════════════════════════════════════════════
   SECTION 23: GOOGLE SHEETS SYNC
   ═══════════════════════════════════════════════════════════ */
const SheetSync = {
  syncing: false,
  lastSync: null,
  connected: false,

  getUrl() {
    return (S.settings.appsScriptUrl || '').trim();
  },

  updateIndicator(state, label) {
    const el = document.getElementById('syncIndicator');
    if (!el) return;
    el.className = 'badge ' + ({
      connected: 'sync-connected',
      syncing: 'sync-syncing badge-pending',
      error: 'sync-error',
      offline: 'sync-offline'
    }[state] || 'badge-pending');
    el.textContent = (state === 'syncing' ? '↻ ' : '● ') + label;
  },

  async apiGet(action, params) {
    const url = this.getUrl();
    if (!url) return null;
    const qs = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(url + '?' + qs, { redirect: 'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  },

  async apiPost(data) {
    const url = this.getUrl();
    if (!url) return null;
    const res = await fetch(url, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  },

  async testConnection() {
    try {
      this.updateIndicator('syncing', 'Testing...');
      const result = await this.apiGet('ping', {});
      if (result && result.ok) {
        this.connected = true;
        this.updateIndicator('connected', 'Connected');
        toast('Connected to Google Sheet', 'success');
        return true;
      }
      throw new Error(result.error || 'Unknown error');
    } catch (err) {
      this.connected = false;
      this.updateIndicator('error', 'Error');
      toast('Connection failed: ' + err.message, 'error');
      return false;
    }
  },

  async pullWeek(weekNum) {
    if (!this.getUrl()) return false;
    try {
      this.updateIndicator('syncing', 'Pulling W' + weekNum + '...');
      const data = await this.apiGet('getWeekPicks', { week: weekNum });
      if (data && data.picks && !data.error) {
        const wk = ensureWeek(weekNum);
        const members = S.settings.members;
        members.forEach(function(m) {
          if (data.picks[m]) {
            wk.picks[m] = data.picks[m].map(function(v) { return v || null; });
          }
        });
        saveStateLocal();
        this.updateIndicator('connected', 'Synced');
        return true;
      }
      if (data && data.error) throw new Error(data.error);
      return false;
    } catch (err) {
      this.updateIndicator('error', 'Pull failed');
      console.error('Sync pull error:', err);
      return false;
    }
  },

  async pullAllWeeks() {
    if (!this.getUrl()) return false;
    try {
      this.syncing = true;
      this.updateIndicator('syncing', 'Pulling all...');
      const data = await this.apiGet('getAllWeeks', {});
      if (data && data.weeks && !data.error) {
        for (var wStr in data.weeks) {
          var weekNum = parseInt(wStr);
          var weekData = data.weeks[wStr];
          if (weekData.picks) {
            var wk = ensureWeek(weekNum);
            S.settings.members.forEach(function(m) {
              if (weekData.picks[m]) {
                wk.picks[m] = weekData.picks[m].map(function(v) { return v || null; });
              }
            });
          }
        }
        saveStateLocal();
        this.lastSync = new Date().toISOString();
        this.connected = true;
        this.syncing = false;
        this.updateIndicator('connected', 'Synced');
        logActivity('Synced all weeks from Google Sheet');
        return true;
      }
      throw new Error((data && data.error) || 'No data');
    } catch (err) {
      this.syncing = false;
      this.updateIndicator('error', 'Sync failed');
      toast('Full sync failed: ' + err.message, 'error');
      return false;
    }
  },

  async pushPicks(weekNum, member, picks) {
    if (!this.getUrl()) return false;
    try {
      this.updateIndicator('syncing', 'Saving...');
      const result = await this.apiPost({
        action: 'savePicks',
        week: weekNum,
        member: member,
        picks: picks
      });
      if (result && result.success) {
        this.updateIndicator('connected', 'Saved');
        return true;
      }
      throw new Error((result && result.error) || 'Save failed');
    } catch (err) {
      this.updateIndicator('error', 'Save failed');
      toast('Sheet sync failed: ' + err.message, 'error');
      return false;
    }
  },

  async pullDashboard() {
    if (!this.getUrl()) return null;
    try {
      return await this.apiGet('getDashboard', {});
    } catch (err) {
      console.error('Dashboard pull error:', err);
      return null;
    }
  },

  initIndicator() {
    if (this.getUrl()) {
      this.updateIndicator('offline', 'Ready');
    } else {
      this.updateIndicator('offline', 'No Sync');
    }
  }
};

function saveStateLocal() {
  try {
    const wk = S.weeks[S.currentWeek];
    if (wk) wk.lastSaved = new Date().toISOString();
    store.setItem(STORAGE_KEY, JSON.stringify(S));
  } catch(e) {}
}

async function manualSync() {
  if (!SheetSync.getUrl()) {
    toast('Set up Google Sheet sync in Settings first', 'warn');
    showSection('settings');
    return;
  }
  const ok = await SheetSync.pullWeek(S.currentWeek);
  if (ok) {
    renderCurrentSection();
    toast('Week ' + S.currentWeek + ' synced from Google Sheet', 'success');
  }
}

/* ═══════════════════════════════════════════════════════════
   SECTION 24: MEMBER IDENTITY & SETUP
   ═══════════════════════════════════════════════════════════ */
function showSetupOverlay() {
  const overlay = document.getElementById('setupOverlay');
  const list = document.getElementById('setupMemberList');
  if (!overlay || !list) return;

  let html = '';
  S.settings.members.forEach(function(m, i) {
    html += '<button class="member-select-btn" onclick="selectMember(\'' + m.replace(/'/g, "\\'") + '\')">'
      + '<span class="member-dot" style="background:' + getMemberColor(i) + '">' + esc(m.charAt(0)) + '</span> '
      + esc(m) + '</button>';
  });
  list.innerHTML = html;
  overlay.style.display = 'flex';
}

function selectMember(name) {
  S.settings.activeMember = name;
  saveStateLocal();
  document.getElementById('setupOverlay').style.display = 'none';
  updateMemberBanner();

  if (SheetSync.getUrl() && S.settings.autoSync) {
    SheetSync.pullWeek(S.currentWeek).then(function(ok) {
      if (ok) renderCurrentSection();
    });
  }
}

function switchMember() {
  showSetupOverlay();
}

function updateMemberBanner() {
  const banner = document.getElementById('memberBanner');
  const nameEl = document.getElementById('memberBannerName');
  if (!banner || !nameEl) return;

  if (S.settings.activeMember) {
    nameEl.textContent = S.settings.activeMember;
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}

/* ═══════════════════════════════════════════════════════════
   SECTION 25: INITIALIZATION
   ═══════════════════════════════════════════════════════════ */
function init() {
  try {
    loadState();
    document.body.setAttribute('data-theme', S.settings.theme || 'dark');
    populateWeekSelector();
    updateCountdown();
    setInterval(updateCountdown, 1000);
    renderCurrentSection();
    updateMemberBanner();
    SheetSync.initIndicator();

    if (!S.settings.activeMember) {
      showSetupOverlay();
    } else if (SheetSync.getUrl() && S.settings.autoSync) {
      SheetSync.pullWeek(S.currentWeek).then(function(ok) {
        if (ok) renderCurrentSection();
      });
    }
  } catch(err) {
    console.error('Init error:', err);
    document.querySelector('.main-content').innerHTML = '<div style="background:var(--red-bg);border:1px solid var(--red);border-radius:8px;padding:20px;margin:20px;color:var(--red);font-size:15px"><strong>Error loading app:</strong> ' + err.message + '<br><br>Try clearing site data or reload the page.</div>';
  }
}

init();

</script>

</html>
