<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Circa Pool">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>Circa Pool Manager — Syndicate Tool</title>
<style>
/* ═══ THEME VARIABLES ═══ */
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #1c2333; --bg4: #21262d;
  --border: #30363d; --border2: #484f58;
  --text: #e6edf3; --text2: #8b949e; --text3: #484f58;
  --gold: #ffd700; --gold2: #b8960c; --gold-bg: rgba(255,215,0,.12);
  --green: #2ea043; --green-bg: rgba(46,160,67,.12);
  --red: #f85149; --red-bg: rgba(248,81,73,.12);
  --blue: #58a6ff; --blue-bg: rgba(88,166,255,.12);
  --purple: #bc8cff; --purple-bg: rgba(188,140,255,.12);
  --orange: #d29922; --orange-bg: rgba(210,153,34,.12);
  --radius: 8px; --radius-sm: 5px;
  --shadow: 0 2px 12px rgba(0,0,0,.3);
  --font: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
[data-theme="light"] {
  --bg: #f6f8fa; --bg2: #ffffff; --bg3: #f0f2f5; --bg4: #e8ebef;
  --border: #d0d7de; --border2: #afb8c1;
  --text: #1f2328; --text2: #656d76; --text3: #afb8c1;
  --shadow: 0 2px 12px rgba(0,0,0,.08);
}

/* ═══ RESET ═══ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;font-size:14px;padding-top:env(safe-area-inset-top,0)}
a{color:var(--blue);text-decoration:none}

/* ═══ LAYOUT ═══ */
.app-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.header-brand{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--gold),#ffed8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.header-disclaimer{font-size:10px;color:var(--text3);max-width:200px;line-height:1.3}

.app-nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none}
.app-nav::-webkit-scrollbar{display:none}
.nav-btn{background:none;border:none;color:var(--text2);padding:11px 16px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:.2s}
.nav-btn:hover{color:var(--text);background:var(--bg3)}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold);background:var(--gold-bg)}
.mobile-menu-btn{display:none;background:none;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:18px}

.main-content{max-width:1200px;margin:0 auto;padding:20px}
.section{display:none}
.section.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ═══ COMPONENTS ═══ */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:700;margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text2);margin-bottom:14px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-tile{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-val{font-size:26px;font-weight:800;color:var(--gold)}
.stat-lbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-top:4px}

.btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-gold{background:linear-gradient(135deg,var(--gold),#ffed8a);color:#000}
.btn-gold:hover{box-shadow:0 2px 8px rgba(255,215,0,.3)}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

select,input[type="text"],input[type="number"],input[type="time"],textarea{
  background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-family:var(--font);width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-bg)}
label{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.form-group{margin-bottom:12px}
textarea{resize:vertical;min-height:60px}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-win{background:var(--green-bg);color:var(--green)}
.badge-loss{background:var(--red-bg);color:var(--red)}
.badge-push{background:var(--gold-bg);color:var(--gold)}
.badge-pending{background:var(--blue-bg);color:var(--blue)}
.badge-open{background:var(--green-bg);color:var(--green)}
.badge-locked{background:var(--red-bg);color:var(--red)}
.badge-finalized{background:var(--purple-bg);color:var(--purple)}
.badge-due{background:var(--orange-bg);color:var(--orange)}
.badge-draft{background:var(--blue-bg);color:var(--blue)}
.badge-approved{background:var(--green-bg);color:var(--green)}

.alert{padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:13px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.alert-info{background:var(--blue-bg);border:1px solid rgba(88,166,255,.25);color:var(--blue)}
.alert-gold{background:var(--gold-bg);border:1px solid var(--gold2);color:var(--gold)}
.alert-warn{background:var(--orange-bg);border:1px solid var(--orange);color:var(--orange)}
.alert-success{background:var(--green-bg);border:1px solid var(--green);color:var(--green)}
.alert-error{background:var(--red-bg);border:1px solid var(--red);color:var(--red)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text2);border-bottom:2px solid var(--border);background:var(--bg);position:sticky;top:0;cursor:pointer}
th:hover{color:var(--gold)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--bg3)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}

.top5-highlight{background:var(--gold-bg) !important}
.tie-indicator{color:var(--orange);font-weight:700;font-size:11px}
.member-dot{display:inline-block;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700;line-height:22px;text-align:center;color:#000;margin-right:3px}

.entry-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.entry-card.locked{border-color:var(--red);background:var(--red-bg)}
.entry-card.finalized{border-color:var(--purple);background:var(--purple-bg)}

.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:12px}

.countdown{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px}
.countdown-open{background:var(--green-bg);color:var(--green)}
.countdown-due{background:var(--orange-bg);color:var(--orange)}
.countdown-locked{background:var(--red-bg);color:var(--red)}

.week-select{width:auto;min-width:100px;font-weight:600;color:var(--gold);background:var(--bg)}

.toast-container{position:fixed;top:16px;right:16px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:toastIn .3s ease;max-width:360px}
.toast-success{background:var(--green);color:#fff}
.toast-error{background:var(--red);color:#fff}
.toast-info{background:var(--blue);color:#fff}
.toast-warn{background:var(--orange);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-lg{max-width:800px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.flex-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.flex-center{display:flex;align-items:center;gap:8px}
.text-gold{color:var(--gold)}.text-green{color:var(--green)}.text-red{color:var(--red)}.text-dim{color:var(--text2)}
.fw-700{font-weight:700}.fs-sm{font-size:12px}.fs-xs{font-size:11px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mt-8{margin-top:8px}.mt-16{margin-top:16px}

.pick-grid-table td select{min-width:140px}
.pick-weight{font-size:11px;color:var(--gold);font-weight:700}
.pick-spread{font-size:11px;color:var(--text2)}
.duplicate-warn{border-color:var(--red) !important;box-shadow:0 0 0 2px var(--red-bg) !important}
.completion-icon{font-size:16px}

.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px}
.bar{background:var(--gold);border-radius:2px 2px 0 0;min-width:20px;transition:height .3s}
.bar-label{font-size:9px;color:var(--text2);text-align:center;margin-top:2px;overflow:hidden}

.heatmap-cell{padding:6px 8px;text-align:center;font-size:12px;font-weight:600;border-radius:3px}

.override-banner{background:var(--orange-bg);border:1px solid var(--orange);border-radius:var(--radius-sm);padding:8px 14px;margin-bottom:12px;font-size:12px;color:var(--orange);display:flex;align-items:center;gap:8px}

.activity-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;gap:8px}
.activity-time{color:var(--text3);white-space:nowrap;min-width:130px}

.copy-btn{cursor:pointer;background:var(--bg);border:1px solid var(--border);color:var(--text2);padding:4px 8px;border-radius:var(--radius-sm);font-size:11px}
.copy-btn:hover{color:var(--gold);border-color:var(--gold)}

.progress-ring{width:40px;height:40px}

/* ═══ SYNC STATUS ═══ */
.sync-connected{background:var(--green-bg);color:var(--green)}
.sync-syncing{background:var(--blue-bg);color:var(--blue);animation:syncPulse 1s infinite}
.sync-error{background:var(--red-bg);color:var(--red)}
.sync-offline{background:var(--orange-bg);color:var(--orange)}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ═══ MEMBER BANNER ═══ */
.member-banner{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:13px}
.member-banner-name{font-weight:700;color:var(--gold)}
.member-banner .btn{padding:4px 10px;font-size:11px;min-height:auto}

/* ═══ SETUP OVERLAY ═══ */
.setup-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
.setup-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:32px;max-width:440px;width:100%}
.setup-title{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--gold),#ffed8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.setup-sub{color:var(--text2);font-size:14px;margin-bottom:24px}
.member-select-btn{display:block;width:100%;padding:16px;margin-bottom:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg3);color:var(--text);font-size:18px;font-weight:600;cursor:pointer;transition:.2s;text-align:center}
.member-select-btn:hover,.member-select-btn:focus{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}

/* ═══ RESPONSIVE ═══ */
/* ═══ MOBILE BOTTOM NAV BAR ═══ */
.mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:200;padding:0;padding-bottom:env(safe-area-inset-bottom,0)}
.mobile-bottom-nav .mob-tabs{display:flex;justify-content:space-around;align-items:stretch}
.mob-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px 6px;flex:1;border:none;background:none;color:var(--text2);font-size:10px;font-weight:500;cursor:pointer;gap:2px;min-height:52px;-webkit-tap-highlight-color:transparent}
.mob-tab .mob-ico{font-size:20px;line-height:1}
.mob-tab.active{color:var(--gold)}
.mob-tab.active .mob-ico{filter:drop-shadow(0 0 4px rgba(255,215,0,.4))}
.mob-more-panel{display:none;position:fixed;bottom:52px;bottom:calc(52px + env(safe-area-inset-bottom,0));left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:8px;z-index:199;animation:slideUp .2s ease}
.mob-more-panel.open{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mob-more-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:12px 6px;font-size:12px;text-align:center;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center;gap:4px}
.mob-more-btn.active{border-color:var(--gold);color:var(--gold);background:var(--gold-bg)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ═══ MOBILE GAME CARDS (replaces tables on small screens) ═══ */
.game-cards{display:none}
.game-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.game-card-matchup{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.game-card-team{font-weight:700;font-size:16px}
.game-card-at{color:var(--text3);font-size:12px;padding:0 6px}
.game-card-lines{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.game-card-line{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;text-align:center}
.game-card-line-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.game-card-line-val{font-size:16px;font-weight:700}
.game-card-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text3)}

@media(max-width:768px){
  .app-header{padding:8px 12px}
  .header-brand{font-size:16px}
  .mobile-menu-btn{display:none}
  .app-nav{display:none !important}
  .mobile-bottom-nav{display:block}
  .main-content{padding:10px;padding-bottom:calc(70px + env(safe-area-inset-bottom,0))}
  .form-row{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .card{padding:14px}
  .header-disclaimer{display:none}
  select,input[type="text"],input[type="number"],input[type="time"],textarea{font-size:16px;padding:10px 12px}
  .btn{padding:10px 16px;font-size:14px;min-height:44px}
  .btn-sm{min-height:40px;padding:8px 12px;font-size:13px}
  .btn-group{flex-direction:column}
  .btn-group .btn{width:100%;justify-content:center}
  table{font-size:12px}
  th,td{padding:8px 6px}
  .entry-card{padding:12px}
  .modal{padding:16px;width:95%}
  .stat-tile{padding:12px}
  .stat-val{font-size:22px}
  .toast-container{top:auto;bottom:calc(60px + env(safe-area-inset-bottom,0));right:8px;left:8px}
  .toast{max-width:100%;font-size:14px}
  .flex-between{flex-direction:column;align-items:stretch;gap:8px}
  .game-cards{display:block}
  .desktop-table{display:none}
  .card-title{font-size:15px}
  .card-sub{font-size:11px}
  .activity-item{flex-direction:column;gap:2px}
  .activity-time{min-width:auto;font-size:10px}
}
@media(max-width:420px){
  .stat-grid{grid-template-columns:1fr 1fr}
  .header-meta{gap:6px}
  .week-select{min-width:80px;font-size:13px}
}

/* ═══ PRINT ═══ */
@media print{
  .app-header,.app-nav,.btn,.toast-container,.no-print{display:none !important}
  .main-content{padding:0}
  .section{display:block !important;page-break-after:always}
  .card{border:1px solid #ccc;box-shadow:none}
  body{background:#fff;color:#000;font-size:12px}
  table{font-size:11px}
  .badge{border:1px solid currentColor}
}
</style>
</head>
<body data-theme="dark">

<!-- ═══ HEADER ═══ -->
<div class="app-header">
  <div class="flex-center">
    <div class="header-brand">CIRCA POOL MANAGER</div>
    <div class="header-disclaimer">Independent pool-management tool. Not affiliated with Circa Sports.</div>
  </div>
  <div class="header-meta">
    <span id="seasonBadge" class="badge badge-pending">2026</span>
    <select id="globalWeek" class="week-select" onchange="onWeekChange()"></select>
    <span id="deadlineCountdown" class="countdown countdown-open"></span>
    <span id="syncIndicator" class="badge badge-pending" style="cursor:pointer;font-size:10px" onclick="manualSync()" title="Click to sync with Google Sheet">&#9679; Offline</span>
    <button class="mobile-menu-btn" onclick="toggleMobileNav()">&#9776;</button>
  </div>
</div>

<!-- ═══ NAV ═══ -->
<nav class="app-nav" id="appNav">
  <button class="nav-btn active" data-sec="dashboard" onclick="showSection('dashboard')">&#128202; Dashboard</button>
  <button class="nav-btn" data-sec="picks" onclick="showSection('picks')">&#127917; Weekly Picks</button>
  <button class="nav-btn" data-sec="tally" onclick="showSection('tally')">&#9878; Weighted Tally</button>
  <button class="nav-btn" data-sec="entries" onclick="showSection('entries')">&#127942; Five Entries</button>
  <button class="nav-btn" data-sec="results" onclick="showSection('results')">&#9989; Results</button>
  <button class="nav-btn" data-sec="season" onclick="showSection('season')">&#128200; Season Summary</button>
  <button class="nav-btn" data-sec="frequency" onclick="showSection('frequency')">&#128202; Team Frequency</button>
  <button class="nav-btn" data-sec="lines" onclick="showSection('lines')">&#128178; Lines &amp; Spreads</button>
  <button class="nav-btn" data-sec="instructions" onclick="showSection('instructions')">&#128214; Instructions</button>
  <button class="nav-btn" data-sec="settings" onclick="showSection('settings')">&#9881; Settings</button>
</nav>

<!-- ═══ TOAST CONTAINER ═══ -->
<div class="toast-container" id="toastContainer"></div>

<!-- ═══ NOSCRIPT ═══ -->
<noscript>
  <div style="background:#ffd700;color:#000;padding:20px;text-align:center;font-family:sans-serif;font-size:16px">
    <strong>JavaScript Required</strong><br>
    This tool requires JavaScript to work. If you're viewing this from an email or file preview, tap the <strong>Share</strong> button (box with arrow) and choose <strong>"Open in Safari"</strong> to use the full app.
  </div>
</noscript>

<!-- ═══ MEMBER BANNER (shown after setup) ═══ -->
<div class="member-banner" id="memberBanner" style="display:none">
  <span>Logged in as</span>
  <span class="member-banner-name" id="memberBannerName"></span>
  <button class="btn btn-outline" onclick="switchMember()">Switch</button>
</div>

<!-- ═══ MEMBER SETUP OVERLAY ═══ -->
<div class="setup-overlay" id="setupOverlay" style="display:none">
  <div class="setup-card">
    <div style="font-size:48px;margin-bottom:12px">&#127942;</div>
    <div class="setup-title">CIRCA POOL MANAGER</div>
    <div class="setup-sub">Welcome to the syndicate. Who are you?</div>
    <div id="setupMemberList"></div>
  </div>
</div>

<!-- ═══ MAIN CONTENT ═══ -->
<div class="main-content">

  <!-- DASHBOARD -->
  <div class="section active" id="sec-dashboard"></div>

  <!-- WEEKLY PICKS -->
  <div class="section" id="sec-picks"></div>

  <!-- WEIGHTED TALLY -->
  <div class="section" id="sec-tally"></div>

  <!-- FIVE ENTRIES -->
  <div class="section" id="sec-entries"></div>

  <!-- RESULTS -->
  <div class="section" id="sec-results"></div>

  <!-- SEASON SUMMARY -->

/* ═══════════════════════════════════════════════════════════
   SECTION 2: STATE MANAGEMENT
   ═══════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'circaPoolManager_v1';

// Storage abstraction — falls back to in-memory if localStorage is blocked (iOS file://)
let _memStore = {};
const store = {
  getItem(k) { try { return localStorage.getItem(k); } catch(e) { return _memStore[k] || null; } },
  setItem(k,v) { try { localStorage.setItem(k,v); } catch(e) { _memStore[k] = v; } },
};

function defaultSettings() {
  return {
    season: 2026,
    members: [...DEFAULT_MEMBERS],
    deadline: { day: 6, time: '10:00', timezone: 'America/Los_Angeles' },
    scoring: { win: 1, push: 0.5, loss: 0 },
    tieBreaking: ['score','members','pick1','pick2','alpha'],
    linesApiUrl: '',
    linesProviderLabel: '',
    oddsApiKey: '',
    diversification: { poolSize: 10, minConsensus: 3, maxExposure: 4 },
    commissionerOverride: false,
    theme: 'dark',
    appsScriptUrl: '',
    autoSync: true,
    activeMember: ''
  };
}

function defaultWeek() {
  return {
    picks: {},
    notes: {},
    lines: {},
    contestLines: {},
    entries: [
      {picks:[null,null,null,null,null],status:'draft',notes:'',manuallyEdited:false},
      {picks:[null,null,null,null,null],status:'draft',notes:'',manuallyEdited:false},
      {picks:[null,null,null,null,null],status:'draft',notes:'',manuallyEdited:false},
      {picks:[null,null,null,null,null],status:'draft',notes:'',manuallyEdited:false},
      {picks:[null,null,null,null,null],status:'draft',notes:'',manuallyEdited:false}
    ],
    frozenLines: {},
    results: {},
    finalized: false,
    overrides: [],
    lastSaved: null
  };
}

function defaultState() {
  return {
    schemaVersion: 1,
    settings: defaultSettings(),
    currentWeek: 1,
    weeks: {},
    activityLog: []
  };
}

let S = defaultState();

function ensureWeek(w) {
  if (!S.weeks[w]) S.weeks[w] = defaultWeek();
  const wk = S.weeks[w];
  S.settings.members.forEach(m => {
    if (!wk.picks[m]) wk.picks[m] = [null,null,null,null,null];
    if (wk.notes[m] === undefined) wk.notes[m] = '';
  });
  if (!wk.entries || wk.entries.length !== 5) {
    wk.entries = [];
    for (let i = 0; i < 5; i++) wk.entries.push({picks:[null,null,null,null,null],status:'draft',notes:'',manuallyEdited:false});
  }
  if (!wk.contestLines) wk.contestLines = {};
  return wk;
}

function W() { return ensureWeek(S.currentWeek); }

function saveState() {
  try {
    const wk = S.weeks[S.currentWeek];
    if (wk) wk.lastSaved = new Date().toISOString();
    store.setItem(STORAGE_KEY, JSON.stringify(S));
  } catch(e) {
    toast('Save failed: ' + e.message, 'error');
  }
}

function saveAndSync() {
  saveState();
  if (SheetSync.getUrl() && S.settings.autoSync && S.settings.activeMember) {
    const wk = S.weeks[S.currentWeek];
    if (wk && wk.picks[S.settings.activeMember]) {
      SheetSync.pushPicks(S.currentWeek, S.settings.activeMember, wk.picks[S.settings.activeMember]);
    }
  }
}

function loadState() {
  try {
    const raw = store.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && typeof data === 'object' && data.schemaVersion) {
      S = data;
      if (!S.settings) S.settings = defaultSettings();
      if (!S.activityLog) S.activityLog = [];
      if (!S.currentWeek) S.currentWeek = 1;
    }
  } catch(e) {
    toast('Data load error — starting fresh. Old data preserved as backup.', 'warn');
    try {
      store.setItem(STORAGE_KEY + '_backup', store.getItem(STORAGE_KEY));
    } catch(e2) {}
  }
}

function logActivity(msg) {
  S.activityLog.unshift({ time: new Date().toISOString(), msg });
  if (S.activityLog.length > 200) S.activityLog.length = 200;
}

/* ═══════════════════════════════════════════════════════════

  d.textContent = String(s);
  return d.innerHTML;
}

function toast(msg, type) {
  type = type || 'info';
  const c = document.getElementById('toastContainer');

  t.className = 'toast toast-' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
}

/* ═══════════════════════════════════════════════════════════
   SECTION 4: DEADLINE & WEEK MANAGEMENT
   ═══════════════════════════════════════════════════════════ */
function getDeadlineDate(weekNum) {
  const s = S.settings;
  const seasonStart = new Date(s.season, 8, 1);
  let firstSunday = new Date(seasonStart);
  while (firstSunday.getDay() !== 0) firstSunday.setDate(firstSunday.getDate() + 1);
  const weekStart = new Date(firstSunday);
  weekStart.setDate(weekStart.getDate() + (weekNum - 1) * 7);
  const deadlineDay = s.deadline.day;
  const diff = (deadlineDay - weekStart.getDay() + 7) % 7;
  const deadlineDate = new Date(weekStart);
  deadlineDate.setDate(deadlineDate.getDate() + diff - 7);
  if (deadlineDate >= weekStart) deadlineDate.setDate(deadlineDate.getDate() - 7);
  const [hh, mm] = (s.deadline.time || '10:00').split(':').map(Number);
  const dlStr = deadlineDate.toLocaleDateString('en-US', {timeZone: s.deadline.timezone || 'America/Los_Angeles'});
  const d = new Date(dlStr);
  d.setHours(hh, mm, 0, 0);
  return d;
}

function getWeekStatus(weekNum) {
  const wk = S.weeks[weekNum];
  if (wk && wk.finalized) return 'finalized';
  if (S.settings.commissionerOverride) return 'open';
  const dl = getDeadlineDate(weekNum);
  const now = new Date();
  const diff = dl - now;
  if (diff <= 0) return 'locked';
  if (diff < 3600000) return 'due';
  return 'open';
}

function updateCountdown() {
  const el = document.getElementById('deadlineCountdown');
  const status = getWeekStatus(S.currentWeek);
  const wk = S.weeks[S.currentWeek];

  if (wk && wk.finalized) {
    el.className = 'countdown countdown-locked';
    el.textContent = 'FINALIZED';
    return;
  }

  if (S.settings.commissionerOverride && status !== 'finalized') {
    el.className = 'countdown countdown-due';
    el.textContent = 'OVERRIDE ACTIVE';
    return;
  }

  const dl = getDeadlineDate(S.currentWeek);
  const now = new Date();
  const diff = dl - now;

  if (diff <= 0) {
    el.className = 'countdown countdown-locked';
    el.textContent = 'LOCKED';
  } else if (diff < 3600000) {
    const mins = Math.floor(diff / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    el.className = 'countdown countdown-due';
    el.textContent = mins + 'm ' + secs + 's left';
  } else {
    const hrs = Math.floor(diff / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    el.className = 'countdown countdown-open';
    el.textContent = hrs + 'h ' + mins + 'm to deadline';
  }
}

function isWeekEditable(weekNum) {
  if (S.settings.commissionerOverride) return true;
  const wk = S.weeks[weekNum];
  if (wk && wk.finalized) return false;
  return getWeekStatus(weekNum) !== 'locked';
}

function populateWeekSelector() {
  const sel = document.getElementById('globalWeek');
  sel.innerHTML = '';
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const o = document.createElement('option');

function onWeekChange() {
  S.currentWeek = parseInt(document.getElementById('globalWeek').value);

/* ═══════════════════════════════════════════════════════════
   SECTION 5: NAVIGATION
   ═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   SECTION 6: PICK VALIDATION & SPREAD HELPERS
   ═══════════════════════════════════════════════════════════ */
function getSpread(weekNum, teamId) {
  // Contest lines take priority (they are the actual Circa contest spreads)
  const cs = getContestSpread(weekNum, teamId);
  if (cs != null) return cs;
  // Fall back to market lines
  const wk = S.weeks[weekNum];
  if (!wk || !wk.lines) return null;
  const line = wk.lines[teamId];
  return line ? line.spread : null;
}

function spreadStr(val) {
  if (val == null || val === '') return '—';
  const n = parseFloat(val);
  return isNaN(n) ? '—' : (n > 0 ? '+' + n : String(n));
}

function validateMemberPicks(weekNum, member) {
  const wk = ensureWeek(weekNum);
  const picks = wk.picks[member] || [];
  const errors = [];
  const seen = {};
  picks.forEach((p, i) => {
    if (p && seen[p]) errors.push('Duplicate: ' + teamInfo(p).abbr + ' in slots ' + seen[p] + ' and ' + (i+1));
    if (p) seen[p] = (seen[p] || '') + (i + 1);
  });
  const filled = picks.filter(p => p != null).length;
  if (filled < 5) errors.push('Only ' + filled + '/5 picks made');
  return { complete: filled === 5 && errors.length === 0, errors, filled };
}

function isMemberComplete(weekNum, member) {
  return validateMemberPicks(weekNum, member).complete;
}

function allMembersComplete(weekNum) {
  return S.settings.members.every(m => isMemberComplete(weekNum, m));
}

/* ═══════════════════════════════════════════════════════════
   SECTION 7: WEIGHTED TALLY CALCULATION
   ═══════════════════════════════════════════════════════════ */
function calculateTally(weekNum) {
  const wk = ensureWeek(weekNum);
  const members = S.settings.members;
  const tally = {};

  members.forEach(m => {
    const picks = wk.picks[m] || [];
    picks.forEach((teamId, slot) => {
      if (!teamId) return;
      if (!tally[teamId]) {
        tally[teamId] = {
          teamId, score: 0, memberCount: 0,
          pick1: 0, pick2: 0, pick3: 0, pick4: 0, pick5: 0,
          supporters: {},
          entryExposure: 0
        };
      }
      const weight = WEIGHTS[slot];
      tally[teamId].score += weight;
      tally[teamId].memberCount++;
      tally[teamId]['pick' + (slot + 1)]++;
      tally[teamId].supporters[m] = slot + 1;
    });
  });

  // Count entry exposure
  if (wk.entries) {
    wk.entries.forEach(entry => {
      (entry.picks || []).forEach(tid => {
        if (tid && tally[tid]) tally[tid].entryExposure++;
      });
    });
  }

  let list = Object.values(tally);
  list = sortTally(list);
  return list;
}

function sortTally(list) {
  const order = S.settings.tieBreaking || ['score','members','pick1','pick2','alpha'];
  return list.sort((a, b) => {
    for (const rule of order) {
      let diff = 0;
      switch (rule) {
        case 'score': diff = b.score - a.score; break;
        case 'members': diff = b.memberCount - a.memberCount; break;
        case 'pick1': diff = b.pick1 - a.pick1; break;
        case 'pick2': diff = b.pick2 - a.pick2; break;
        case 'alpha': diff = teamInfo(a.teamId).full.localeCompare(teamInfo(b.teamId).full); break;
      }
      if (diff !== 0) return diff;
    }
    return 0;
  });
}

function hasTie(list, idx) {
  if (idx <= 0) return false;
  return list[idx].score === list[idx - 1].score;
}

function getTop5(weekNum) {
  const list = calculateTally(weekNum);
  return list.slice(0, 5);
}

/* ═══════════════════════════════════════════════════════════
   SECTION 8: CONTEST ENTRY LOGIC
   ═══════════════════════════════════════════════════════════ */
function validateEntry(entry) {
  const picks = entry.picks || [];
  const filled = picks.filter(p => p != null);
  const unique = new Set(filled);
  if (filled.length < 5) return { valid: false, msg: filled.length + '/5 teams selected' };
  if (unique.size < filled.length) return { valid: false, msg: 'Duplicate teams in entry' };
  return { valid: true, msg: 'Valid' };
}

function validateAllEntries(weekNum) {
  const wk = ensureWeek(weekNum);
  return wk.entries.every(e => validateEntry(e).valid);
}

function populateConsensus(weekNum) {
  const wk = ensureWeek(weekNum);
  const top5 = getTop5(weekNum).map(t => t.teamId);
  wk.entries.forEach(entry => {
    entry.picks = [...top5];
    while (entry.picks.length < 5) entry.picks.push(null);
    entry.status = 'draft';
  });
  logActivity('All 5 entries populated with consensus picks for Week ' + weekNum);
  saveState();
}

function generateDiversified(weekNum) {
  const wk = ensureWeek(weekNum);
  const cfg = S.settings.diversification;
  const tally = calculateTally(weekNum);
  const poolSize = Math.min(cfg.poolSize || 10, tally.length);
  const pool = tally.slice(0, poolSize);
  const top5ids = tally.slice(0, 5).map(t => t.teamId);
  const minCon = cfg.minConsensus || 3;
  const maxExp = cfg.maxExposure || 4;

  if (pool.length < 5) {
    toast('Not enough candidates to generate entries', 'warn');
    return;
  }

  // Entry 1 = top 5 consensus
  wk.entries[0].picks = pool.slice(0, 5).map(t => t.teamId);
  wk.entries[0].status = 'draft';
  wk.entries[0].notes = 'Top 5 consensus';

  // Track exposure
  const exposure = {};
  pool.forEach(t => exposure[t.teamId] = 0);
  wk.entries[0].picks.forEach(id => { if (exposure[id] !== undefined) exposure[id]++; });

  // Entries 2-5: diversify
  for (let e = 1; e < 5; e++) {
    const entry = [];
    // Add top consensus picks first (up to minCon)
    const available = pool.filter(t => (exposure[t.teamId] || 0) < maxExp);
    const consensusAvail = available.filter(t => top5ids.includes(t.teamId));
    const nonConsensus = available.filter(t => !top5ids.includes(t.teamId));

    // Take up to minCon from consensus
    for (const t of consensusAvail) {
      if (entry.length >= minCon) break;
      if (!entry.includes(t.teamId)) entry.push(t.teamId);
    }
    // Fill remaining from non-consensus (by weight)
    for (const t of nonConsensus) {
      if (entry.length >= 5) break;
      if (!entry.includes(t.teamId)) entry.push(t.teamId);
    }
    // If still short, backfill from consensus
    for (const t of consensusAvail) {
      if (entry.length >= 5) break;
      if (!entry.includes(t.teamId)) entry.push(t.teamId);
    }
    // Last resort: any remaining pool
    for (const t of pool) {
      if (entry.length >= 5) break;
      if (!entry.includes(t.teamId)) entry.push(t.teamId);
    }

    wk.entries[e].picks = entry.slice(0, 5);
    wk.entries[e].status = 'draft';
    wk.entries[e].notes = 'Diversified suggestion';
    entry.forEach(id => { if (exposure[id] !== undefined) exposure[id]++; });
  }

  logActivity('Generated diversified entries for Week ' + weekNum);
  saveState();
}

function freezeEntryLines(weekNum) {
  const wk = ensureWeek(weekNum);
  wk.frozenLines = {};
  wk.entries.forEach((entry, i) => {

function getResultPoints(result) {
  const sc = S.settings.scoring;
  switch(result) {
    case 'win': return sc.win;
    case 'push': return sc.push;
    case 'loss': return sc.loss;
    default: return null;
  }
}

function getMemberWeeklyResults(weekNum, member) {
  const wk = ensureWeek(weekNum);
  const picks = wk.picks[member] || [];
  let w = 0, l = 0, p = 0, pts = 0, pending = 0;
  picks.forEach(tid => {
    if (!tid) return;
    const r = wk.results[tid];
    if (!r || r === 'pending') { pending++; return; }
    if (r === 'win') { w++; pts += S.settings.scoring.win; }
    else if (r === 'push') { p++; pts += S.settings.scoring.push; }
    else if (r === 'loss') { l++; pts += S.settings.scoring.loss; }
  });
  return { w, l, p, pts, pending, total: w + l + p };
}

function getEntryWeeklyResults(weekNum, entryIdx) {
  const wk = ensureWeek(weekNum);
  const entry = wk.entries[entryIdx];
  if (!entry) return { w:0, l:0, p:0, pts:0, pending:0, total:0 };
  let w = 0, l = 0, p = 0, pts = 0, pending = 0;
  (entry.picks || []).forEach(tid => {
    if (!tid) return;
    const r = wk.results[tid];
    if (!r || r === 'pending') { pending++; return; }
    if (r === 'win') { w++; pts += S.settings.scoring.win; }
    else if (r === 'push') { p++; pts += S.settings.scoring.push; }
    else if (r === 'loss') { l++; pts += S.settings.scoring.loss; }
  });
  return { w, l, p, pts, pending, total: w + l + p };
}

function getMemberSeasonStats(member) {
  let w=0,l=0,p=0,pts=0,weeksPlayed=0,totalPicks=0;
  for (let wk = 1; wk <= TOTAL_WEEKS; wk++) {
    const r = getMemberWeeklyResults(wk, member);
    if (r.total > 0) {
      w += r.w; l += r.l; p += r.p; pts += r.pts;
      weeksPlayed++;
    }
    totalPicks += (S.weeks[wk]?.picks[member] || []).filter(x=>x).length;
  }
  return { w, l, p, pts, weeksPlayed, totalPicks, avg: weeksPlayed > 0 ? (pts / weeksPlayed).toFixed(2) : '0' };
}

function getEntrySeasonStats(entryIdx) {
  let w=0,l=0,p=0,pts=0,weeksPlayed=0,best=0,worst=999,bestWk=0,worstWk=0;
  for (let wk = 1; wk <= TOTAL_WEEKS; wk++) {
    const r = getEntryWeeklyResults(wk, entryIdx);
    if (r.total > 0) {
      w += r.w; l += r.l; p += r.p; pts += r.pts;
      weeksPlayed++;
      if (r.pts > best) { best = r.pts; bestWk = wk; }
      if (r.pts < worst) { worst = r.pts; worstWk = wk; }
    }
  }
  if (weeksPlayed === 0) worst = 0;
  return { w, l, p, pts, weeksPlayed, best, worst, bestWk, worstWk, avg: weeksPlayed > 0 ? (pts / weeksPlayed).toFixed(2) : '0' };
}

/* ═══════════════════════════════════════════════════════════
   SECTION 10: TEAM FREQUENCY CALCULATION
   ═══════════════════════════════════════════════════════════ */
function calculateFrequency(opts) {
  opts = opts || {};
  const startWk = opts.startWeek || 1;
  const endWk = opts.endWeek || TOTAL_WEEKS;
  const filterMember = opts.member || null;
  const members = S.settings.members;
  const freq = {};

  NFL_TEAMS.forEach(t => {
    freq[t.id] = {
      teamId: t.id, total: 0, byMember: {},
      weightedPts: 0, ranks: [], entryUse: [0,0,0,0,0],
      entryTotal: 0, w: 0, l: 0, p: 0, resultPts: 0
    };
    members.forEach(m => freq[t.id].byMember[m] = 0);
  });

  for (let wk = startWk; wk <= endWk; wk++) {
    const weekData = S.weeks[wk];
    if (!weekData) continue;

    members.forEach(m => {
      if (filterMember && m !== filterMember) return;
      const picks = weekData.picks[m] || [];
      picks.forEach((tid, slot) => {
        if (!tid || !freq[tid]) return;
        freq[tid].total++;
        freq[tid].byMember[m]++;
        freq[tid].weightedPts += WEIGHTS[slot];
        freq[tid].ranks.push(slot + 1);
      });
    });

    if (weekData.entries) {
      weekData.entries.forEach((entry, ei) => {
        (entry.picks || []).forEach(tid => {
          if (tid && freq[tid]) {
            freq[tid].entryUse[ei]++;
            freq[tid].entryTotal++;
          }
        });
      });
    }

    // Results
    if (weekData.results) {
      Object.entries(weekData.results).forEach(([tid, r]) => {
        if (!freq[tid]) return;
        if (r === 'win') { freq[tid].w++; freq[tid].resultPts += S.settings.scoring.win; }
        else if (r === 'push') { freq[tid].p++; freq[tid].resultPts += S.settings.scoring.push; }
        else if (r === 'loss') { freq[tid].l++; }
      });
    }
  }

  return Object.values(freq).map(f => {
    f.avgRank = f.ranks.length > 0 ? (f.ranks.reduce((a,b) => a+b, 0) / f.ranks.length).toFixed(1) : '—';
    return f;
  });
}

  'TEN':'TEN','WSH':'WAS','WAS':'WAS'
};

function espnToLocal(abbr) { return ESPN_TEAM_MAP[abbr] || abbr; }

/* The Odds API full team name → local ID mapping */
const ODDS_API_TEAM_MAP = {
  'Arizona Cardinals':'ARI','Atlanta Falcons':'ATL','Baltimore Ravens':'BAL',
  'Buffalo Bills':'BUF','Carolina Panthers':'CAR','Chicago Bears':'CHI',
  'Cincinnati Bengals':'CIN','Cleveland Browns':'CLE','Dallas Cowboys':'DAL',

  'San Francisco 49ers':'SF','Seattle Seahawks':'SEA','Tampa Bay Buccaneers':'TB',
  'Tennessee Titans':'TEN','Washington Commanders':'WAS'
};

function oddsApiToLocal(name) { return ODDS_API_TEAM_MAP[name] || name; }

/* ── The Odds API fetch (primary — supports CORS, free tier) ── */
async function fetchOddsAPILines(weekNum) {
  const key = S.settings.oddsApiKey;
  if (!key) {
    toast('No Odds API key configured. Go to Settings → Lines Provider to add one.', 'warn');
    return 0;
  }
  toast('Fetching live NFL spreads...', 'info');
  try {
    const url = 'https://api.the-odds-api.com/v4/sports/americanfootball_nfl/odds/?apiKey=' +
      encodeURIComponent(key) + '&regions=us&markets=spreads&oddsFormat=american&bookmakers=draftkings,fanduel';
    const res = await fetch(url);
    if (res.status === 401) { toast('Invalid API key. Check your key in Settings.', 'error'); return 0; }
    if (res.status === 429) { toast('API rate limit reached. Try again later or upgrade plan.', 'error'); return 0; }
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const remaining = res.headers.get('x-requests-remaining');
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('Unexpected response format');

    const wk = ensureWeek(weekNum);
    let count = 0;

    data.forEach(game => {
      const homeTeamName = game.home_team;
      const awayTeamName = game.away_team;
      const homeId = oddsApiToLocal(homeTeamName);
      const awayId = oddsApiToLocal(awayTeamName);
      if (!TEAM_MAP[homeId] || !TEAM_MAP[awayId]) return;

      const gameTime = game.commence_time ? new Date(game.commence_time).toLocaleString('en-US', {
        weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'
      }) : '';

      // Find spread from bookmakers
      let homeSpread = null;
      for (const bk of (game.bookmakers || [])) {
        const spreadMkt = (bk.markets || []).find(m => m.key === 'spreads');
        if (spreadMkt) {
          const homeOutcome = (spreadMkt.outcomes || []).find(o => o.name === homeTeamName);
          if (homeOutcome && homeOutcome.point != null) {
            homeSpread = homeOutcome.point;
            break;
          }
        }
      }

      // Store for home team
      wk.lines[homeId] = {
        spread: homeSpread,
        opponent: awayId,
        homeAway: 'home',
        gameDate: gameTime,
        source: 'DraftKings/FanDuel (Market)',
        sourceTimestamp: new Date().toISOString(),
        manual: false,
        lastUpdate: new Date().toISOString(),
        lineType: 'market',
        notes: ''
      };

      // Store for away team (inverse)
      wk.lines[awayId] = {
        spread: homeSpread != null ? -homeSpread : null,
        opponent: homeId,
        homeAway: 'away',
        gameDate: gameTime,
        source: 'DraftKings/FanDuel (Market)',
        sourceTimestamp: new Date().toISOString(),
        manual: false,
        lastUpdate: new Date().toISOString(),
        lineType: 'market',
        notes: ''
      };
      count++;
    });

    saveState();
    const msg = count + ' games loaded' + (remaining ? ' (' + remaining + ' API calls remaining this month)' : '');
    toast(msg, 'success');
    logActivity('Live market lines fetched: ' + count + ' games' + (remaining ? ' | ' + remaining + ' calls left' : ''));
    return count;
  } catch(err) {
    toast('Odds API failed: ' + err.message, 'error');
    return 0;
  }
}

async function fetchESPNLinesForWeek(weekNum) {
  toast('Fetching Week ' + weekNum + ' lines from ESPN/DraftKings...', 'info');
  try {
    const base = 'https://sports.core.api.espn.com/v2/sports/football/leagues/nfl';
    const eventsUrl = base + '/seasons/' + S.settings.season + '/types/2/weeks/' + weekNum + '/events?lang=en&region=us';
    const eventsRes = await fetch(eventsUrl);
    if (!eventsRes.ok) throw new Error('Events list HTTP ' + eventsRes.status);
    const eventsData = await eventsRes.json();
    const eventRefs = (eventsData.items || []).map(i => (i['$ref'] || '').replace('http://', 'https://')).filter(Boolean);

    if (eventRefs.length === 0) throw new Error('No games found for Week ' + weekNum);
    toast('Found ' + eventRefs.length + ' games, fetching spreads...', 'info');

    const wk = ensureWeek(weekNum);
    let count = 0, spreadCount = 0;

    for (let i = 0; i < eventRefs.length; i += 4) {
      const batch = eventRefs.slice(i, i + 4);
      const results = await Promise.allSettled(batch.map(async ref => {
        const eventRes = await fetch(ref);
        if (!eventRes.ok) return null;
        const ev = await eventRes.json();

        // Parse team abbreviations from shortName (e.g. "NE @ SEA")
        const shortName = ev.shortName || '';
        const parts = shortName.split(' @ ');
        if (parts.length !== 2) return null;
        const awayAbbr = espnToLocal(parts[0].trim());
        const homeAbbr = espnToLocal(parts[1].trim());
        if (!awayAbbr || !homeAbbr) return null;

        // Verify teams exist in our mapping
        if (!TEAM_MAP[homeAbbr] && !TEAM_MAP[awayAbbr]) return null;

        const gameDate = ev.date || '';
        const comps = ev.competitions || [];
        const comp = comps[0];
        if (!comp) return null;

        // Fetch odds from the $ref
        let homeSpread = null, details = '';
        const oddsObj = comp.odds;
        const oddsUrl = oddsObj && oddsObj['$ref'] ? oddsObj['$ref'].replace('http://', 'https://') : null;
        if (oddsUrl) {
          try {
            const oddsRes = await fetch(oddsUrl);
            if (oddsRes.ok) {
              const oddsData = await oddsRes.json();
              const items = oddsData.items || [oddsData];
              const first = items[0] || oddsData;
              if (first.spread != null) homeSpread = parseFloat(first.spread);
              if (first.details) details = first.details;
            }
          } catch(e) {}
        }

        return { homeTeam: homeAbbr, awayTeam: awayAbbr, homeSpread, gameDate, details };
      }));

      for (const r of results) {
        if (r.status !== 'fulfilled' || !r.value) continue;
        const { homeTeam, awayTeam, homeSpread, gameDate, details } = r.value;
        const dt = gameDate ? new Date(gameDate).toLocaleString('en-US', {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';

        wk.lines[homeTeam] = {
          spread: homeSpread,
          opponent: awayTeam,
          homeAway: 'home',
          gameDate: dt,
          source: 'ESPN/DraftKings',
          sourceTimestamp: new Date().toISOString(),
          manual: false,
          lastUpdate: new Date().toISOString(),
          lineType: 'market',
          details: details,
          notes: ''
        };

        wk.lines[awayTeam] = {
          spread: homeSpread != null ? -homeSpread : null,
          opponent: homeTeam,
          homeAway: 'away',
          gameDate: dt,
          source: 'ESPN/DraftKings',
          sourceTimestamp: new Date().toISOString(),
          manual: false,
          lastUpdate: new Date().toISOString(),
          lineType: 'market',
          notes: ''
        };
        count++;
        if (homeSpread != null) spreadCount++;
      }
    }

    saveState();
    toast(count + ' games loaded, ' + spreadCount + ' with spreads (Week ' + weekNum + ')', 'success');
    logActivity('ESPN market lines fetched for Week ' + weekNum + ': ' + count + ' games, ' + spreadCount + ' with spreads');
    return count;
  } catch(err) {
    toast('ESPN fetch failed: ' + err.message, 'error');
    console.error('ESPN fetch error:', err);
    return 0;
  }
}

/* Custom provider fetch (original) */
function fetchLinesForWeek(weekNum) {
  const url = S.settings.linesApiUrl;
  if (!url) return fetchESPNLinesForWeek(weekNum);
  const controller = new AbortController();
  const tid = setTimeout(() => controller.abort(), 10000);
  return fetch(url.replace('{week}', weekNum), { signal: controller.signal })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (!data || !Array.isArray(data)) throw new Error('Invalid response');
      const wk = ensureWeek(weekNum);
      data.forEach(item => {
        if (item.team && TEAM_MAP[item.team]) {
          wk.lines[item.team] = {
            spread: parseFloat(item.spread) || null, opponent: item.opponent || '',
            homeAway: item.homeAway || '', gameDate: item.gameDate || '',
            source: S.settings.linesProviderLabel || url,
            sourceTimestamp: new Date().toISOString(), manual: false,
            lastUpdate: new Date().toISOString(), lineType: 'market', notes: ''
          };
        }
      });
      saveState();
      toast('Lines imported for Week ' + weekNum, 'success');
      logActivity('Fetched lines from provider for Week ' + weekNum);
    })
    .catch(err => { toast('Provider fetch failed: ' + err.message + '. Trying ESPN...', 'warn'); return fetchESPNLinesForWeek(weekNum); });
}

async function finalizeWeek() {
  const wk = ensureWeek(S.currentWeek);
  if (!allMembersComplete(S.currentWeek)) {
    toast('Cannot finalize: not all members have 5 picks', 'warn');
    return;
  }
  if (!validateAllEntries(S.currentWeek)) {
    if (S.settings.commissionerOverride) {
      const ok = await showConfirm('Commissioner Override', 'Not all entries are valid. Finalize anyway with commissioner override?');
      if (!ok) return;
      logActivity('Commissioner override: finalized Week ' + S.currentWeek + ' with incomplete entries');
    } else {
      toast('Cannot finalize: not all entries are valid (5 unique teams each)', 'warn');
      return;
    }
  }
  const ok = await showConfirm('Finalize Week ' + S.currentWeek, 'Lock all picks and entries for Week ' + S.currentWeek + '? Lines will be frozen. This can only be undone with commissioner override.');
  if (!ok) return;
  wk.finalized = true;
  freezeEntryLines(S.currentWeek);
  wk.entries.forEach(e => e.status = 'finalized');
  logActivity('Week ' + S.currentWeek + ' finalized');
  saveState();
  toast('Week ' + S.currentWeek + ' finalized', 'success');
  renderCurrentSection();
  updateCountdown();
}

// Settings handlers
function s_updateSeason(v) { S.settings.season = parseInt(v) || 2026; saveState(); document.getElementById('seasonBadge').textContent = S.settings.season + ' Season'; }
function s_updateTheme(v) { S.settings.theme = v; document.body.setAttribute('data-theme', v); saveState(); }
function s_updateMember(i, v) {
  const old = S.settings.members[i];
  S.settings.members[i] = v.trim() || old;
  // Migrate picks
  for (const wkNum in S.weeks) {
    const wk = S.weeks[wkNum];
    if (wk.picks[old]) { wk.picks[v.trim()] = wk.picks[old]; delete wk.picks[old]; }
    if (wk.notes[old] !== undefined) { wk.notes[v.trim()] = wk.notes[old]; delete wk.notes[old]; }
  }
  saveState(); logActivity('Renamed member ' + old + ' to ' + v.trim());
}
function s_updateDeadlineDay(v) { S.settings.deadline.day = parseInt(v); saveState(); updateCountdown(); }
function s_updateDeadlineTime(v) { S.settings.deadline.time = v; saveState(); updateCountdown(); }
function s_updateDeadlineTZ(v) { S.settings.deadline.timezone = v; saveState(); updateCountdown(); }
function s_updateScoring(k, v) { S.settings.scoring[k] = parseFloat(v) || 0; saveState(); }
function s_moveTB(idx, dir) {
  const arr = S.settings.tieBreaking;
  const ni = idx + dir;
  if (ni < 0 || ni >= arr.length) return;
  [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
  saveState(); renderSettings();
}
function s_updateOddsKey(v) { S.settings.oddsApiKey = v.trim(); saveState(); toast(v.trim() ? 'API key saved' : 'API key cleared', 'success'); renderSettings(); }
function s_updateLinesUrl(v) { S.settings.linesApiUrl = v; saveState(); }
function s_updateLinesLabel(v) { S.settings.linesProviderLabel = v; saveState(); }
function s_updateDiv(k, v) { S.settings.diversification[k] = parseInt(v) || 0; saveState(); }
function s_toggleOverride(v) {
  S.settings.commissionerOverride = v;
  if (v) logActivity('Commissioner override enabled');
  else logActivity('Commissioner override disabled');
  saveState(); updateCountdown(); renderSettings();
}

function s_updateAppsScriptUrl(v) {
  S.settings.appsScriptUrl = v.trim();
  saveState();
  SheetSync.initIndicator();
  toast(v.trim() ? 'Sync URL saved' : 'Sync URL cleared', 'success');
  renderSettings();
}
function s_toggleAutoSync(v) { S.settings.autoSync = v; saveState(); }
async function s_testSheetConnection() { await SheetSync.testConnection(); }
async function s_pullAllFromSheet() {
  if (!SheetSync.getUrl()) { toast('Set the Apps Script URL first', 'warn'); return; }
  toast('Pulling all week data from Google Sheet...', 'info');
  const ok = await SheetSync.pullAllWeeks();
  if (ok) { renderCurrentSection(); toast('All data synced from sheet', 'success'); }
}
async function s_pushCurrentWeek() {
  if (!SheetSync.getUrl()) { toast('Set the Apps Script URL first', 'warn'); return; }
  const wk = ensureWeek(S.currentWeek);
  const allPicks = {};
  S.settings.members.forEach(function(m) { allPicks[m] = wk.picks[m] || [null,null,null,null,null]; });
  SheetSync.updateIndicator('syncing', 'Pushing...');
  try {
    const result = await SheetSync.apiPost({ action: 'saveAllPicks', week: S.currentWeek, allPicks: allPicks });
    if (result && result.success) {
      SheetSync.updateIndicator('connected', 'Pushed');
      toast('Week ' + S.currentWeek + ' pushed to Google Sheet', 'success');
    } else { throw new Error((result && result.error) || 'Push failed'); }
  } catch (err) {
    SheetSync.updateIndicator('error', 'Push failed');
    toast('Push failed: ' + err.message, 'error');
  }
}

let picksActiveMember = null;

function teamSelectHTML(memberIdx, slot, current, exclude, weekNum) {
  const selId = 'pick-' + memberIdx + '-' + slot;
  let html = '<select id="' + selId + '" onchange="onPickChange(' + memberIdx + ',' + slot + ',this.value)" style="min-width:150px;width:100%">';
  html += '<option value="">— Select Team —</option>';
  NFL_TEAMS.forEach(t => {
    const disabled = exclude.includes(t.id) && t.id !== current;
    const spVal = getSpread(weekNum, t.id);
    const spLabel = spVal != null ? ' (' + spreadStr(spVal) + ')' : '';
    html += '<option value="' + t.id + '"' + (t.id === current ? ' selected' : '') + (disabled ? ' disabled' : '') + '>' + t.abbr + ' ' + t.name + spLabel + '</option>';
  });
  html += '</select>';
  return html;
}

function renderPicksFull() {
  const el = document.getElementById('sec-picks');
  const wk = ensureWeek(S.currentWeek);
  const members = S.settings.members;

    } else {

    }
  }

        <div class="card-title" style="font-size:20px;margin-bottom:6px">Who are you?</div>

        <div style="display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto">
          ${members.map((m, i) => {
            const complete = isMemberComplete(S.currentWeek, m);
            return '<button class="btn btn-gold" style="width:100%;padding:16px 20px;font-size:18px;min-height:56px;justify-content:center;border-radius:var(--radius)" onclick="switchPicksMemberIdx(' + i + ')">' + memberDot(m) + ' ' + esc(m) + (complete ? ' &#9989;' : '') + '</button>';
          }).join('')}
        </div>
      </div>
      <div class="card" style="margin-top:12px">
        <div class="card-title">Week ${S.currentWeek} Status</div>
        <div style="margin-top:12px">

  tabs += '<button class="btn btn-outline" style="min-height:44px;font-size:14px" onclick="picksActiveMember=null;renderPicksFull()">&#8592; Back</button>';
  members.forEach((m, i) => {
    const complete = isMemberComplete(S.currentWeek, m);
    const active = m === picksActiveMember;
    tabs += '<button class="btn ' + (active ? 'btn-gold' : 'btn-outline') + '" style="min-height:44px;font-size:14px" onclick="switchPicksMemberIdx(' + i + ')">';
    tabs += memberDot(m) + ' ' + esc(m);

    tabs += '</button>';
  });
  tabs += '</div>';

  // Status
  const status = getWeekStatus(S.currentWeek);
  let statusHtml = '';
  if (wk.finalized) statusHtml = '<div class="alert alert-warn">&#128274; Week ' + S.currentWeek + ' is finalized. Editing requires commissioner override.</div>';
  else if (!editable) statusHtml = '<div class="alert alert-warn">&#128274; Past deadline — editing locked. Enable commissioner override in Settings to edit.</div>';
  if (S.settings.commissionerOverride && (wk.finalized || status === 'locked')) {
    statusHtml = '<div class="override-banner">&#9888; Commissioner Override active — editing unlocked</div>';

  // Pick grid for active member
  const memberPicks = wk.picks[picksActiveMember] || [null,null,null,null,null];
  const exclude = memberPicks.filter(p => p != null);

  grid += '<span class="badge badge-' + (validation.complete ? 'win' : 'pending') + '">' + (validation.complete ? 'Complete' : validation.filled + '/5') + '</span></div>';

  }

  for (let slot = 0; slot < 5; slot++) {
    const current = memberPicks[slot];
    const sp = current ? getSpread(S.currentWeek, current) : null;

    grid += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    grid += '<span class="fw-700" style="font-size:15px">Pick ' + (slot + 1) + '</span>';
    grid += '<span style="background:' + weightColors[slot] + ';color:#000;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700">' + WEIGHTS[slot] + ' pts</span>';
    grid += '</div>';

      grid += '<div>' + teamSelectHTML(memberIdx, slot, current, exclude.filter(e => e !== current), S.currentWeek) + '</div>';

      grid += '<div class="fw-700" style="font-size:16px;padding:8px 0">' + (current ? esc(teamLabel(current)) : '<span class="text-dim">No pick</span>') + '</div>';

    grid += '<button class="btn btn-outline btn-sm" onclick="clearWeekPicksUI()">Clear Entire Week</button>';
    grid += '</div>';
  }

  grid += '</div>';

  // All members summary — desktop table
  let summary = '<div class="card"><div class="card-title">All Members — Week ' + S.currentWeek + '</div><div class="card-sub">Quick view of everyone\'s picks</div>';
  summary += '<div class="table-wrap desktop-table"><table><thead><tr><th>Member</th><th>Pick 1 (5)</th><th>Pick 2 (4)</th><th>Pick 3 (3)</th><th>Pick 4 (2)</th><th>Pick 5 (1)</th><th>Status</th></tr></thead><tbody>';
  members.forEach(m => {
    const p = wk.picks[m] || [];
    const v = validateMemberPicks(S.currentWeek, m);
    summary += '<tr>';
    summary += '<td>' + memberDot(m) + ' <strong>' + esc(m) + '</strong></td>';
    for (let s = 0; s < 5; s++) {
      const tid = p[s];
      summary += '<td class="fs-sm">' + (tid ? '<strong>' + esc(teamInfo(tid).abbr) + '</strong>' : '<span class="text-dim">—</span>') + '</td>';
    }
    summary += '<td><span class="badge badge-' + (v.complete ? 'win' : 'pending') + '">' + (v.complete ? '&#10003;' : v.filled + '/5') + '</span></td>';
    summary += '</tr>';
  });
  summary += '</tbody></table></div>';
  // Mobile card summary
  summary += '<div class="game-cards">';
  members.forEach(m => {
    const p = wk.picks[m] || [];
    const v = validateMemberPicks(S.currentWeek, m);
    summary += '<div class="game-card">';
    summary += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' + memberDot(m) + ' <strong style="flex:1;margin-left:4px">' + esc(m) + '</strong><span class="badge badge-' + (v.complete ? 'win' : 'pending') + '">' + (v.complete ? 'Complete' : v.filled + '/5') + '</span></div>';

      const tid = p[s];
      summary += '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px;font-size:12px"><span class="text-gold fw-700" style="font-size:10px">' + WEIGHTS[s] + '</span> ' + (tid ? '<strong>' + esc(teamInfo(tid).abbr) + '</strong>' : '<span class="text-dim">—</span>') + '</div>';

  el.innerHTML = statusHtml + tabs + grid + summary;

function switchPicksMember(name) {
  picksActiveMember = name;
  renderPicksFull();
}

function switchPicksMemberIdx(idx) {
  picksActiveMember = S.settings.members[idx];
  renderPicksFull();
}

function onPickChange(memberIdx, slot, newVal) {
  const member = S.settings.members[memberIdx];
  if (!member) return;
  const wk = ensureWeek(S.currentWeek);
  if (!wk.picks[member]) wk.picks[member] = [null,null,null,null,null];
  newVal = newVal || null;

  if (newVal && wk.picks[member].some((p, i) => i !== slot && p === newVal)) {
    toast(teamInfo(newVal).abbr + ' already selected — choose a different team', 'warn');
    renderPicksFull();
    return;
  }

  wk.picks[member][slot] = newVal;

  if (S.settings.commissionerOverride && (wk.finalized || getWeekStatus(S.currentWeek) === 'locked')) {
    logActivity('Override edit: ' + member + ' Pick ' + (slot+1) + ' changed in Week ' + S.currentWeek);
    wk.overrides.push({ time: new Date().toISOString(), action: member + ' Pick ' + (slot+1) + ' changed' });
  }

  saveAndSync();
  renderPicksFull();
}

function saveMemberNote() {
  const wk = ensureWeek(S.currentWeek);
  const el = document.getElementById('memberNote');
  if (el) { wk.notes[picksActiveMember] = el.value; saveState(); }
}

async function clearMemberPicksUI() {
  const ok = await showConfirm('Clear Picks', 'Clear all of ' + picksActiveMember + '\'s picks for Week ' + S.currentWeek + '?');
  if (!ok) return;
  const wk = ensureWeek(S.currentWeek);
  wk.picks[picksActiveMember] = [null,null,null,null,null];
  logActivity('Cleared ' + picksActiveMember + '\'s picks for Week ' + S.currentWeek);
  saveState();
  renderPicksFull();
}

async function clearWeekPicksUI() {
  const ok = await showConfirm('Clear Week', 'Clear ALL members\' picks for Week ' + S.currentWeek + '? This cannot be undone.');
  if (!ok) return;
  const wk = ensureWeek(S.currentWeek);
  S.settings.members.forEach(m => wk.picks[m] = [null,null,null,null,null]);
  logActivity('Cleared all picks for Week ' + S.currentWeek);
  saveState();
  renderPicksFull();
}
